      return srgb(new THREE.CanvasTexture(c));
    })();
    const sh = this.shadow = new THREE.Mesh(new THREE.PlaneGeometry(.07*BOY.K,.07*BOY.K),
      new THREE.MeshBasicMaterial({map:shTex, transparent:true, opacity:.3, depthWrite:false}));
    sh.rotation.x = -Math.PI/2; root.add(sh);

    /* ---- sky furniture ---- */
    this.clouds = buildClouds(root);
    this.sun = buildSun(root);

    /* ---- particles ---- */
    const ffN = LITE ? 70 : 130, stN = LITE ? 70 : 120;
    this.ff = makePoints(ffN, '#FFE38A', .030,
      {x:[-.46,.46], y:[.05,.56], z:[-.44,.46]}, GLOW, true);
    root.add(this.ff.pts);
    this.stars = makePoints(stN, '#FFF8E4', .016,
      {x:[-.62,.62], y:[.52,.98], z:[-.70,.40]}, GLOW, true);
    root.add(this.stars.pts);
    this.embers = makePoints(14, '#FFC070', .010,
      {x:[-.01,.01], y:[.0,.07], z:[-.01,.01]}, GLOW, true);
    this.embers.pts.position.copy(temple.diyaPos);
    temple.g.add(this.embers.pts);

    /* ---- her name, in a garland of marigolds, over the house ---- */
    const fin = this.finale = buildFinale((CONFIG.herName||'').trim());
    fin.fin.position.set(HOUSE_P.x, HOUSE_Y + 0.30, HOUSE_P.z + 0.06);
    root.add(fin.fin);

    this.petals = buildPetals(LITE ? 14 : 26);
    root.add(this.petals.group);

    if (DEMO){
      addEventListener('pointermove', e => { if (e.buttons & 1) this.userRot += e.movementX*.008; });
    }
  },

  setupRenderer(){
    if (this._renderReady) return;
    const r = this.el.sceneEl.renderer; if (!r) return;
    this._renderReady = true;
    r.shadowMap.enabled = !LITE;
    r.shadowMap.type = THREE.PCFSoftShadowMap;
    // Cap pixel ratio: 2 on phones keeps the drawing buffer inside mobile-GPU limits.
    try{ r.setPixelRatio(Math.min(window.devicePixelRatio||1, MOBILE ? 2 : 3)); }catch(e){}
    try{ MAXANISO = r.capabilities.getMaxAnisotropy(); }catch(e){}
    if (!LITE){
      try{ this.el.sceneEl.object3D.environment = makeEnv(r); }
      catch(e){ console.warn('env map skipped', e); }
    }
    // If the GPU drops the context, say so instead of showing a silent black screen.
    try{
      const cv = this.el.sceneEl.canvas;
      if (cv) cv.addEventListener('webglcontextlost', ev => {
        ev.preventDefault();
        if (LITE){ hint('Graphics overloaded on this device — reload to retry.', true); return; }
        hint('Graphics overloaded — tap here for the lighter version.', true);
        const h = $('hint'); h.style.pointerEvents = 'auto';
        h.onclick = ()=>{
          const q = new URLSearchParams(location.search);
          q.delete('full'); q.set('lite','1'); location.search = q.toString();
        };
      });
    }catch(e){}
  },

  /* A diorama standing straight out of the card is only flattering when the card is lying
     flat. Held upright — on a screen, or in someone's hand — you stare straight down the
     island's own "up" axis and get a map. So lean it about the card's horizontal axis until
     the camera sits CONFIG.ar.tilt degrees above its ground plane, and damp it so the lean
     follows you smoothly instead of snapping. */
  updateTilt(dt){
    const o = this.el.object3D, par = o.parent; if (!par) return;
    const d = par.worldToLocal(this.camPos.clone());
    const len = d.length(), R = Math.hypot(d.y, d.z);
    // Until the target is found MindAR parks the anchor on an all-zero matrix, so worldToLocal
    // hands back NaN. Written as !(x>e) so NaN is rejected too — NaN<e is false, and one NaN
    // frame would stick in the damped value and NaN the whole transform for the life of the page.
    if (!(len > 1e-6) || !(R > 1e-6)) return;
    const psi = Math.atan2(d.y, d.z);
    const th = clamp(
      Math.asin(clamp(Math.sin(CONFIG.ar.tilt*Math.PI/180)*len/R, -1, 1)) - psi,
      20*Math.PI/180, Math.PI/2);
    if (!isFinite(th)) return;
    this.tilt = this.tilt === null ? th : damp(this.tilt, th, 4, dt);
    o.rotation.x = this.tilt;
  },

  /* where he is on the trail, as a fraction of the climb */
  walkU(t){
    const B = CONFIG.beats, uT = this.uTemple;
    if (t <= B.walkOne) return 0;
    if (t < B.reachTemple) return uT * stroll(B.walkOne, B.reachTemple, t);
    if (t < B.walkTwo) return uT;
    if (t < B.reachHome) return uT + (1-uT) * stroll(B.walkTwo, B.reachHome, t);
    return 1;
  },

  applyPose(p, dt){
    const b = this.boy;
    b.body.position.y = p.y;
    b.upper.rotation.x = p.lean;
    b.head.rotation.x = damp(b.head.rotation.x, p.head, 9, dt);
    for (let i=0;i<2;i++){
      b.hips[i].rotation.x = p.hip[i];
      b.knees[i].rotation.x = p.knee[i];
      b.shoulders[i].rotation.x = p.sh[i][0];
      b.shoulders[i].rotation.z = p.sh[i][1];
      b.elbows[i].rotation.x = p.el[i];
    }
  },

  tick(time, dtms){
    const dt = Math.min(dtms/1000, .1), ts = time/1000, B = CONFIG.beats;
    P.update(dt);
    const t = P.t;
    updateLyrics(t);

    const root = this.root, b = this.boy;
    const cam = this.el.sceneEl.camera;
    if (cam) cam.getWorldPosition(this.camPos);
    if (this.tiltAuto) this.updateTilt(dt);
    if (DEMO) root.rotation.y = this.userRot;

    // the pop-up: it grows out of the card rather than simply being there
    root.scale.setScalar(Math.max(.0001, easeOutBack(t/1.2)));

    /* ---- golden hour falling into dusk ---- */
    const dusk = ramp(B.walkTwo-2, B.reachHome+4, t) + ramp(B.reachHome+4, B.garland, t)*0.75;
    const d1 = clamp(dusk, 0, 1), d2 = clamp(dusk-1, 0, 1);
    const stops = skyStops(dusk);
    const L = this.L;
    L.amb.intensity = lerp(lerp(.78,.42,d1), .24, d2);
    L.amb.color.set(mix('#FFF1DC', '#8E6E8E', d1)).lerp(new THREE.Color('#4A4472'), d2);
    L.hemi.intensity = lerp(lerp(.62,.40,d1), .26, d2);
    L.hemi.color.set(stops[1]);
    L.hemi.groundColor.set(mix('#5A4458', '#241E34', d1));
    L.sun.intensity = lerp(lerp(1.55,.62,d1), .14, d2);
    L.sun.color.set(mix('#FFD09A', '#E0784F', d1)).lerp(new THREE.Color('#6E4A78'), d2);
    L.rim.intensity = d1*.85*(1-d2*.45);
    L.rim.color.set(mix('#FF9A85', '#8E6AB4', d2));
    L.moon.intensity = d2*.34;

    // the sun sinks behind the range, exactly as far as it does on the card
    const sink = clamp(dusk, 0, 1.4);
    const sy = this.sun.y0 - sink*0.42;
    this.sun.g.position.y = sy;
    this.sun.disc.material.opacity = clamp(1 - sink*0.95, 0, 1) * 0.95;
    this.sun.halo.material.opacity = clamp(1 - sink*0.72, 0, 1) * 0.55;
    this.sun.halo.material.color.set(mix('#FFD089', '#C8562E', d1));
    this.sun.halo.scale.setScalar(0.62 + 0.10*Math.sin(ts*0.7));
    // keep the key light roughly where the sun is, so the shadows lengthen with it
    L.sun.position.set(.52, Math.max(.26, sy*1.1), -1.12).normalize().multiplyScalar(1.6);

    this.clouds.forEach(c => {
      c.position.x = -0.85 + ((ts*0.010 + c.userData.off) % 1) * 1.7;
      c.position.y = c.userData.y + Math.sin(ts*0.3 + c.userData.off*6)*0.008;
      c.children.forEach(m => {
        m.material.color.set(mix('#FFD3A4', '#6E4A74', d1)).lerp(new THREE.Color('#2A2446'), d2);
        m.material.emissiveIntensity = lerp(.35, .06, d1);
      });
    });

    /* ---- the mountains through the day ----
       Clear afternoon light, warming as the sun drops; alpenglow on the rock and snow at
       sunset; then the cold blue of moonlight, with the snow still faintly holding the light. */
    const warm = ramp(B.reachTemple - 6, B.walkTwo, t);
    const glow = ramp(0.25, 0.75, d1) * (1 - ramp(0.15, 0.7, d2));
    this.rangeTint.set('#FFFFFF').lerp(this._cWarm, warm*(1-d1))
      .lerp(this._cGlow, glow).lerp(this._cNight, ramp(0.1, 0.9, d2));
    this.rangeGlow.set('#000000').lerp(this._cGlowE, glow*0.3).lerp(this._cNightE, ramp(0.2, 1, d2));
    this.rangeMats.forEach(m => { m.color.copy(this.rangeTint); m.emissive.copy(this.rangeGlow); });

    /* ---- where he is ---- */
    const u = this.walkU(t);
    // stride follows the ground actually covered, so the feet never swing while he stands still
    const speed = (this.walkU(t + .05) - this.walkU(t - .05)) / .1 * this.trailLen;
    this.amp = damp(this.amp, clamp(speed / 0.012, 0, 1), 9, dt);
    const p = this.trail.getPointAt(u), tan = this.trail.getTangentAt(u);
    const step = Math.min(Math.abs(u - this.lastU) * this.trailLen, 0.02);   // a seek is not a step
    this.lastU = u;
    // a slow walker takes shorter steps, not just slower ones: aim for ~0.7 strides a second,
    // and size the stride (two steps) to the pace. One stride = 4 x leg x sin(thigh swing).
    this.stride = damp(this.stride || 0.06*BOY.K, clamp(speed / 0.7, 0.05*BOY.K, 0.11*BOY.K), 3, dt);
    const swing = Math.asin(clamp(this.stride / (4*BOY.LEG), 0, 0.6));
    this.phase = (this.phase || 0) + step / this.stride * Math.PI * 2;

    const kneel = ramp(B.kneelDown, B.kneelDown+2.4, t) * (1 - ramp(B.riseUp, B.riseUp+2.0, t));
    const bowAmt = ramp(B.riseUp+1.6, B.riseUp+2.8, t) * (1 - ramp(B.riseUp+3.0, B.walkTwo-0.2, t));
    const turn  = ramp(B.turnAround, B.turnAround+2.2, t);
    const offer = ramp(B.kneelOffer, B.kneelOffer+2.6, t);

    let pose = blendPose(POSE.stand, walkPose(this.phase, this.amp, swing), this.amp);
    if (kneel   > .001) pose = blendPose(pose, POSE.pray, kneel);
    if (bowAmt  > .001) pose = blendPose(pose, POSE.namaste, bowAmt);
    if (turn    > .001) pose = blendPose(pose, blendPose(POSE.stand, POSE.offer, offer), turn);
    // he breathes, and rides a little higher at mid-stance
    pose = Object.assign({}, pose);
    pose.lean += Math.sin(t*1.5 + .6)*0.012*(1-this.amp);
    this.applyPose(pose, dt);

    const bob = Math.sin(t*1.5)*0.0012*(1-this.amp);
    const lift = bridgeLift((u - this.uB) * this.trailLen);
    b.root.position.set(p.x, H(p.x, p.z) + BOY.LIFT + lift + bob, p.z);

    // which way he is looking
    let target;
    if (t >= B.turnAround){
      const cl = root.worldToLocal(this.camPos.clone());
      target = Math.atan2(cl.x - p.x, cl.z - p.z);
    } else if ((t > B.reachTemple - 1 && t < B.walkTwo) || kneel > .01 || bowAmt > .01){
      // from the last steps of the approach until he walks on, he faces the shrine
      target = Math.atan2(TEMPLE_P.x - p.x, TEMPLE_P.z - p.z);
    } else {
      target = Math.atan2(tan.x, tan.z);
    }
    if (!this.started){ this.yaw = target; this.started = true; }
    this.yaw += shortAngle(this.yaw, target) * (1 - Math.exp(-5*dt));
    b.root.rotation.y = this.yaw;

    // leaning into the hill
    const fx = Math.sin(this.yaw)*0.035, fz = Math.cos(this.yaw)*0.035;
    const slope = (H(p.x+fx, p.z+fz) - H(p.x-fx, p.z-fz)) / 0.07;
    b.body.rotation.x = damp(b.body.rotation.x, -Math.atan(slope)*0.42*(1-kneel*0.7), 6, dt);

    // blinking, and the gurans opening in his hand
    const wantBlink = ((ts % 3.6) < .12) ? .16 : 1;
    this.blink = damp(this.blink, wantBlink, 22, dt);
    b.eyes.forEach(e => e.scale.y = this.blink);
    const fl = spring((t - (B.kneelOffer + 0.3)) / 1.4);
    b.flower.scale.setScalar(Math.max(.0001, fl));
    b.fHalo.material.opacity = fl * (0.35 + 0.1*Math.sin(ts*4));

    this.shadow.position.set(p.x, H(p.x, p.z) + 0.006 + lift, p.z);
    this.shadow.material.opacity = (0.32 - Math.abs(pose.y)*2.2) * clamp(root.scale.x, 0, 1);
    this.shadow.scale.setScalar(lerp(1, 0.88, this.amp*0.5));

    /* ---- the lamp he lights ---- */
    const T = this.temple;
    const lampOn = ramp(B.kneelDown+2.2, B.kneelDown+4.0, t);
    const flick = 1 + .14*Math.sin(ts*17) + .09*Math.sin(ts*29) + .05*Math.sin(ts*41);
    T.flame.scale.set(Math.max(.0001, lampOn*(0.85+0.1*Math.sin(ts*9))),
                      Math.max(.0001, lampOn*flick),
                      Math.max(.0001, lampOn*(0.85+0.1*Math.sin(ts*9))));
    T.flame.rotation.z = .06*Math.sin(ts*9);
    T.dLight.intensity = lampOn*(0.75 + 0.18*Math.sin(ts*13));
    T.dHalo.material.opacity = lampOn*(0.62 + 0.14*Math.sin(ts*13));
    T.dHalo.scale.setScalar(0.075*(1 + 0.08*Math.sin(ts*17)));
    T.bell.rotation.z = Math.sin(ts*3.1)*0.038*lampOn;
    this.embers.pts.visible = lampOn > .05;
    this.embers.pts.material.opacity = lampOn*0.75;
    this.animPoints(this.embers, ts, 'rise');
    // the oil lamps round the platform warm up as the light goes
    const lampDusk = clamp(dusk*1.3, 0, 1);
    T.lamps.forEach(L2 => {
      L2.fl.material.opacity = lampDusk*0.9;
      L2.hl.material.opacity = lampDusk*(0.45 + 0.14*Math.sin(ts*5 + L2.phase));
      L2.hl.scale.setScalar(0.05*(1 + 0.07*Math.sin(ts*6 + L2.phase)));
    });

    /* ---- home ---- */
    const Hs = this.house;
    let lit = 0;
    Hs.glowMats.forEach((m, i)=>{
      const q = ramp(B.houseLights, B.houseLights + 0.6, t);
      lit += q / Hs.glowMats.length;
      m.color.set(mix('#2A2030', '#FFC866', q));
      Hs.haloS[i].material.opacity = q*(0.62 + 0.1*Math.sin(ts*3.4 + i*1.3));
      Hs.haloS[i].scale.setScalar(0.055*(1 + 0.07*Math.sin(ts*3 + i)));
    });
    Hs.light.intensity = 1.0*lit;
    Hs.smoke.forEach((sm, i)=>{
      const on = t > B.houseLights + 0.5;
      const ph = ((ts*0.20 + i/Hs.smoke.length) % 1);
      sm.visible = on;
      sm.position.set(Hs.chimney.x + 0.012*Math.sin(ph*6 + i),
                      Hs.chimney.y + ph*0.16,
                      Hs.chimney.z + 0.010*Math.cos(ph*5 + i));
      sm.scale.setScalar(0.022 + ph*0.055);
      sm.material.opacity = on ? 0.28*(1-ph)*clamp((t - B.houseLights)/3, 0, 1) : 0;
    });

    /* ---- her name blooms ---- */
    const F = this.finale;
    F.fin.visible = t > B.garland - 0.2;
    if (F.fin.visible){
      F.fin.lookAt(this.camPos);
      F.flowers.forEach(f => {
        const s = spring((t - B.garland - Math.abs(f.userData.u - 0.5)*2.6) / 1.1);
        f.scale.setScalar(Math.max(.0001, s));
        const e = easeOutExpo((t - B.garland - Math.abs(f.userData.u - 0.5)*2.6) / 1.1);
        f.position.x = lerp(0, f.userData.home.x, e);
        f.position.y = lerp(0, f.userData.home.y, e);
      });
      F.leaves.forEach(lf => {
        const s = Math.max(.0001, easeOutBack((t - B.garland - 0.5 - Math.abs(lf.userData.u-0.5)*2.4)/0.9));
        lf.scale.set(lf.userData.base.x*s, lf.userData.base.y*s, lf.userData.base.z*s);
      });
      const np = ramp(B.garland + 1.6, B.garland + 4.0, t);
      F.nameMesh.material.opacity = np;
      F.nameMesh.position.y = -0.012 + (1-np)*0.020;
      F.nameHalo.material.opacity = np*0.30;
      F.rule.material.opacity = np;
      F.rule.scale.x = np;
      F.back.material.opacity = ramp(B.garland, B.garland+2.2, t)*(0.22 + 0.05*Math.sin(ts*3));
    }

    /* ---- petals on the wind ---- */
    const pOn = t > B.garland + 1;
    this.petals.group.visible = pOn;
    if (pOn){
      const R = this.petals;
      for (const it of R.items){
        if (t - it.born > 10 || it.born < 0){
          it.born = t - Math.random()*9;
          it.x = HOUSE_P.x + (Math.random()-0.5)*0.34;
          it.y = HOUSE_Y + 0.40 + Math.random()*0.08;
          it.z = HOUSE_P.z + 0.05 + (Math.random()-0.5)*0.12;
          it.vx = (Math.random()-0.5)*0.016; it.vy = -0.030 - Math.random()*0.020;
          it.vz = 0.006 + Math.random()*0.014;
        }
        const age = t - it.born;
        it.m.position.set(it.x + it.vx*age + Math.sin(age*1.5 + it.ph)*0.022,
                          it.y + it.vy*age,
                          it.z + it.vz*age);
        it.m.rotation.set(it.rot + it.vr*age*0.6, it.rot*0.7 + it.vr*age, it.vr*age*0.4);
        it.m.scale.setScalar(it.sc);
        it.m.material.opacity = clamp(age/1.2,0,1) * clamp((10-age)/3,0,1) * 0.92;
      }
    }

    /* ---- fireflies rising out of the grass, and the first stars ---- */
    const fAmt = ramp(B.walkTwo+2, B.reachHome, t);
    this.ff.pts.visible = fAmt > 0.01;
    this.ff.pts.material.opacity = fAmt*0.95;
    const starAmt = clamp((dusk-0.35)/0.8, 0, 1);
    this.stars.pts.visible = starAmt > 0.01;
    this.stars.pts.material.opacity = starAmt*(0.55 + 0.25*Math.sin(ts*2));
    this.animPoints(this.ff, ts, 'rise');
    this.animPoints(this.stars, ts, 'twinkle');

    /* ---- prayer flags in the wind ---- */
    for (const f of this.flags){
      f.pivot.rotation.y = f.baseRot + Math.sin(ts*2.3 + f.i*0.8)*0.30;
      f.pivot.rotation.x = Math.sin(ts*1.9 + f.i)*0.12;
      const pos = f.geo.attributes.position, base = f.base;
      for (let k=0;k<pos.count;k++){
        const x = base[k*3], y = base[k*3+1];
        const d = clamp(x/0.03, 0, 1);            // 0 at the pole, 1 at the free edge
        pos.setZ(k, (Math.sin(ts*6 + x*70 + f.i)*0.004 + Math.sin(ts*4 + y*40)*0.002)*d);
      }
      pos.needsUpdate = true;
    }

    /* ---- the river, holding the last of the sun ---- */
    this.riverTex.offset.x = -ts*0.05;
    this.riverTex.offset.y = Math.sin(ts*0.3)*0.015;
    const gu = (ts*0.045) % 1, gp = this.river.getPointAt(gu);
    this.glint.position.set(gp.x, H(gp.x, gp.z) + 0.028, gp.z);
    this.glint.material.opacity = (0.40 + 0.32*Math.sin(ts*6)) * (1 - d1*0.8);
    this.glint.scale.setScalar(0.055 + 0.02*Math.sin(ts*8));

    /* ---- the overlay ---- */
    if (t > B.finalLine && !$('endcard').classList.contains('on')){
      $('endq').textContent = CONFIG.finalWords;
      $('endcard').classList.add('on');
    }
    // the letter waits until the last line has had a moment to land
    $('love').classList.toggle('on', t > B.finalLine + 5 && $('final').hidden);
    if (DEMO && !this.seeking){ $('dSeek').value = t; $('dTime').textContent = t.toFixed(1)+'s'; }
    // NB: no early-out when the song ends. The tracking has to keep running, or the diorama
    // freezes in mid-air the moment the music stops.
  },

  animPoints(sys, ts, mode){
    if (!sys.pts.visible) return;
    const a = sys.pts.geometry.attributes.position, bs = sys.base, sd = sys.seeds, bx = sys.box;
    for (let i=0;i<sys.n;i++){
      let x = bs[i*3], y = bs[i*3+1], z = bs[i*3+2];
      if (mode === 'rise'){
        const rg = bx.y[1]-bx.y[0];
        y = bx.y[0] + ((y - bx.y[0] + ts*0.022*(0.6 + (sd[i]%1))) % rg);
        x += Math.sin(ts*0.8 + sd[i])*0.028;
        z += Math.cos(ts*0.6 + sd[i]*2)*0.028;
      } else {
        y += Math.sin(ts*0.5 + sd[i])*0.008;
      }
      a.setXYZ(i, x, y, z);
    }
    a.needsUpdate = true;
    if (sys.flicker){
      const col = sys.pts.geometry.attributes.color;
      for (let i=0;i<sys.n;i++){
        const v = 0.35 + 0.65*Math.abs(Math.sin(ts*(1.4 + (sd[i]%1)*2.2) + sd[i]));
        col.setXYZ(i, v, v, v);
      }
      col.needsUpdate = true;
    }
  }
});
</script>
<script>
/* ============================================================
   boot
   ============================================================ */
const AR = CONFIG.ar;

function dioramaComp(){
  const e = document.querySelector('[diorama]');
  return e && e.components && e.components.diorama;
}

/* ---------- the story ---------- */
function resetStory(){
  lyricIdx = -1; lyricGen++;
  $('lyric').classList.remove('on');
  $('endcard').classList.remove('on');
  $('love').classList.remove('on');
  $('final').hidden = true;
  document.body.classList.remove('asking');
  $('finalReply').classList.remove('on');
  $('finalReply').textContent = '';
  const d = dioramaComp();
  if (d){ d.phase = 0; d.started = false; d.amp = 0; d.lastU = 0; }
  P.seek(0);
}

function launch(){
  if (DEMO){ launchDemo(); return; }
  hint('Opening camera… [' + BUILD + (LITE ? ' lite' : ' full') + ']');

  // A pre-flight getUserMedia that opens the camera and closes it again leaves a black video
  // on some phones, so only the context and the permission get checked here. MindAR opens the
  // camera exactly once.
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    hint('The camera needs a secure page: open this over https:// or http://localhost — not a file:// link.', true);
    return;
  }
  if (navigator.permissions && navigator.permissions.query){
    navigator.permissions.query({name:'camera'})
      .then(p => p.state === 'denied'
        ? hint('Camera permission is blocked. Allow it in your browser settings, then reload.', true)
        : startAR())
      .catch(startAR);
  } else startAR();
}

// The diorama carries its own lighting rig (warm sun, dusk rim, hemisphere fill) as raw
// three.js objects, which A-Frame cannot see — so it would also add its own default ambient
// and directional, flattening every shadow. Drop them.
const RENDER = (LITE
  ? 'renderer="colorManagement: true; sortTransparentObjects: true"'
  : 'renderer="colorManagement: true; toneMapping: ACESFilmic; exposure: 1.08; antialias: true; precision: high; highRefreshRate: true; sortTransparentObjects: true"')
  + ' light="defaultLightsEnabled: false"';

function startAR(){
  const sc = AR.scale;
  // Starting lean. With tiltAuto the island re-aims itself every frame (see updateTilt);
  // 90 is the physically correct "stands straight out of the card" orientation.
  const tilt = TILT_FIXED !== null ? TILT_FIXED : (AR.tiltAuto ? AR.tilt : 90);
  // NOTE: no maxCanvasWidth/Height override — the default keeps the drawing buffer small
  // enough for mobile GPUs. A larger cap plus a high pixelRatio blacks out the canvas.
  $('stage').innerHTML =
    '<a-scene mindar-image="imageTargetSrc: ' + AR.target +
      '; uiLoading: no; uiScanning: no; uiError: no" ' + RENDER +
    ' color-space="sRGB" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">' +
      '<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>' +
      '<a-entity id="anchor" mindar-image-target="targetIndex: 0">' +
        '<a-entity diorama rotation="' + tilt + ' 0 0" position="0 ' + AR.lift + ' 0" ' +
          'scale="' + sc + ' ' + sc + ' ' + sc + '"></a-entity>' +
      '</a-entity>' +
    '</a-scene>';

  const scene = $('stage').querySelector('a-scene');
  scene.addEventListener('arReady', ()=>{
    hint('Point your camera at the card · ' + BUILD);
    // MindAR works out the camera's fov and aspect from #stage's box the instant AR starts.
    // If the layout had not settled by then (mobile URL bar, safe-area insets), make it
    // measure again on the next frame.
    requestAnimationFrame(()=> dispatchEvent(new Event('resize')));
  });
  scene.addEventListener('arError', ()=>
    hint('The camera could not start. Close anything else using it, then reload.', true));

  const anchor = $('anchor');
  anchor.addEventListener('targetFound', ()=>{ hint(null); P.play(); });
  anchor.addEventListener('targetLost',  ()=>{
    P.pause();
    if (P.t < CONFIG.beats.hold) hint('Keep the card in view · ' + BUILD);
  });
}

/* ?demo — no camera, no card. The island hangs in front of a dusk background and the pointer
   spins it. Good for composing and for retiming the beats, but remember what it does not
   cover: it bypasses MindAR entirely, so "it works here" says nothing about the AR path. */
function launchDemo(){
  $('stage').innerHTML =
    '<a-scene ' + RENDER + ' background="color: #140D1E"' +
    ' vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">' +
      '<a-entity camera look-controls="enabled: false" position="0 0.62 1.45" rotation="-19 0 0"></a-entity>' +
      '<a-entity diorama rotation="0 0 0"></a-entity>' +
    '</a-scene>';
  $('demoBar').hidden = false;
  $('dSeek').max = CONFIG.beats.hold + 6;
  $('dPlay').onclick = ()=> P.playing ? P.pause() : P.play();
  const sk = $('dSeek');
  sk.oninput = ()=>{ const d = dioramaComp(); if (d) d.seeking = true; P.seek(+sk.value); };
  const done = ()=>{ const d = dioramaComp(); if (d) d.seeking = false; };
  sk.onchange = done; sk.addEventListener('pointerup', done);
  hint('demo · drag to spin · ' + BUILD);
  P.play();
}

/* ---------- the opening card ---------- */
function begin(){
  $('gate').classList.add('gone');
  $('hud').classList.add('on');
  P.unlock();                 // has to happen inside the tap, or mobile never lets us play
  resetStory();
  setupDiag();
  launch();
}
$('begin').addEventListener('click', begin, {once:true});

$('btnReplay').addEventListener('click', ()=>{ resetStory(); P.play(); });

let muted = false;
$('btnSound').addEventListener('click', ()=>{
  muted = !muted;
  P.audio.muted = muted;
  $('btnSound').classList.toggle('off', muted);
});

/* ---------- the letter ---------- */
const LT = CONFIG.letter;
$('finalLead').textContent = LT.lead;
$('finalQ').textContent = LT.ask;
if (LT.np){
  const s = document.createElement('span');
  s.id = 'finalNp'; s.textContent = LT.np;
  $('finalQ').appendChild(s);
}
$('yesBtn').textContent = LT.yes;

$('love').addEventListener('click', ()=>{
  $('final').hidden = false;
  document.body.classList.add('asking');
  $('love').classList.remove('on');
});
$('closeBtn').addEventListener('click', ()=>{
  $('final').hidden = true;
  document.body.classList.remove('asking');
});
$('yesBtn').addEventListener('click', ()=>{
  const r = $('finalReply');
  r.textContent = LT.reply; r.classList.add('on');
  petalBurst();
});

// hearts, and sayapatri and gurans flowers, falling over her answer
const HEART_COLS  = ["#CE2E4F", "#F0566F", "#E8436A", "#FF8FA3"];
const FLOWER_COLS = [["#F0892B","#F6B23A"], ["#CE2E4F","#FFE1A8"], ["#F0566F","#FFE1A8"],
                     ["#F6B23A","#F0892B"], ["#FFB3C6","#F6B23A"]];
const heartSVG = c =>
  '<svg viewBox="0 0 24 22"><path fill="' + c + '" d="M12 21.5C5.6 16.4 1 12.6 1 7.4 1 3.9 3.7 1.2 ' +
  '7 1.2c2 0 3.9 1 5 2.6 1.1-1.6 3-2.6 5-2.6 3.3 0 6 2.7 6 6.2 0 5.2-4.6 9-11 14.1z"/></svg>';
const flowerSVG = ([p, c]) => {
  let g = '';
  for (let k=0;k<5;k++)
    g += '<ellipse cx="12" cy="6.2" rx="3.9" ry="5.6" fill="' + p + '" transform="rotate(' + k*72 + ' 12 12)"/>';
  return '<svg viewBox="0 0 24 24">' + g + '<circle cx="12" cy="12" r="3.4" fill="' + c + '"/></svg>';
};
function petalBurst(){
  if (REDUCED) return;
  for (let i=0;i<46;i++){
    const s = document.createElement('span');
    s.className = 'petal';
    const heart = i % 2 === 0;
    const w = (heart ? 14 : 13) + Math.random()*14;
    s.style.width = w + 'px';
    s.style.height = (heart ? w*0.92 : w) + 'px';
    s.innerHTML = heart ? heartSVG(HEART_COLS[(i/2|0) % HEART_COLS.length])
                        : flowerSVG(FLOWER_COLS[(i/2|0) % FLOWER_COLS.length]);
    s.style.left = (Math.random()*100) + 'vw';
    s.style.opacity = (0.65 + Math.random()*0.35).toFixed(2);
    s.style.setProperty('--dx', ((Math.random()-0.5)*180) + 'px');
    // hearts drift down mostly upright; flowers spin as they fall
    s.style.setProperty('--rot', ((Math.random()-0.5)*(heart ? 120 : 760)) + 'deg');
    s.style.animationDuration = (3 + Math.random()*3.6) + 's';
    s.style.animationDelay = (Math.random()*1.3) + 's';
    document.body.appendChild(s);
    setTimeout(()=> s.remove(), 9000);
  }
}

// marigolds on the opening card
(function markMarigolds(){
  const mk = $('markPetals');
  const NS = 'http://www.w3.org/2000/svg';
  for (let i=0;i<8;i++){
    const a = i/8*6.283;
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', (60 + Math.cos(a)*15).toFixed(1));
    c.setAttribute('cy', (28 + Math.sin(a)*15).toFixed(1));
    c.setAttribute('r', 4.6);
    mk.appendChild(c);
  }
  const c = document.createElementNS(NS, 'circle');
  c.setAttribute('cx', 60); c.setAttribute('cy', 28); c.setAttribute('r', 7);
  c.setAttribute('fill', '#F0892B');
  mk.appendChild(c);
})();

/* ---------- diagnostics ----------
   Phones have no devtools. The fields below are chosen so that each failure we have actually
   hit names itself: a zero-height stage, fov 0 / aspect Infinity, a NaN tilt, a dead clock.
   A diagnostic that leaves out the broken field is worse than none — it builds confidence in
   the wrong direction. */
let diagEl = null;
function setupDiag(){
  if (!DEBUG || diagEl) return;
  diagEl = document.createElement('div');
  diagEl.id = 'diag';
  document.body.appendChild(diagEl);
  setInterval(()=>{
    const scene = document.querySelector('a-scene');
    const r = scene && scene.renderer, v = document.querySelector('video');
    const d = dioramaComp(), st = $('stage'), c = scene && scene.camera;
    diagEl.textContent = [
      'build ' + BUILD + (LITE ? ' lite' : ' full') + (DEMO ? ' demo' : '') +
        ' secure=' + isSecureContext,
      'scene=' + !!scene + ' renderer=' + !!r,
      'stage=' + (st ? st.clientWidth + 'x' + st.clientHeight : '-'),
      // fov 0 / aspect Infinity here = MindAR measured a zero-height container (NaN projection)
      'cam fov=' + (c ? (+c.fov).toFixed(1) : '-') +
        ' aspect=' + (c ? (+c.aspect).toFixed(2) : '-') +
        ' near=' + (c ? (+c.near).toFixed(3) : '-'),
      't=' + P.t.toFixed(1) + ' audioOK=' + P.audioOK + ' playing=' + P.playing,
      'rootScale=' + (d && d.root ? d.root.scale.x.toFixed(3) : '-') +
        ' tilt=' + (d && d.tilt != null ? (d.tilt*180/Math.PI).toFixed(0) + '°' : '-'),
      'draws=' + (r ? r.info.render.calls : '-') + ' tris=' + (r ? r.info.render.triangles : '-'),
      'canvas=' + (r && r.domElement ? r.domElement.width + 'x' + r.domElement.height : '-'),
      'video=' + (v ? v.videoWidth + 'x' + v.videoHeight + ' paused=' + v.paused : 'none')
    ].join('\n');
  }, 500);
}
