<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Timro Lagi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
<!-- A-Frame + MindAR track the card; everything you see is a real three.js diorama standing
     on it. (The 2D build drew SVG planes instead — same story, same palette, same beats.) -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  :root{
    --ink:#2A1B2E;
    --cream:#F6EEDD;
    --gold:#E8B44A;
    --marigold:#F0892B;
    --guras:#CE2E4F;
    --maroon:#7B1F32;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  /* an id rule with display:flex outranks the UA's [hidden]{display:none} — say it louder */
  [hidden]{display:none !important;}
  html,body{height:100%;margin:0;padding:0;background:#0B0A14;overflow:hidden;}
  body{
    font-family:"Tiro Devanagari Hindi", Georgia, serif;
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;
    user-select:none;-webkit-user-select:none;
  }

  /* MindAR measures sceneEl.parentNode — this div — to size the camera feed AND to derive the
     AR camera's fov/aspect. An auto-height div measures 0 tall, which gives fov:0 and
     aspect:Infinity, a NaN projection matrix, and a scene that renders perfectly nothing.
     It MUST fill the viewport. (LEARNINGS.md §1 — this one rule cost four builds.) */
  #stage{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;z-index:1;}
  /* A-Frame's headset buttons have no business on a greeting card */
  .a-enter-vr,.a-enter-ar,.a-enter-vr-button,.a-enter-ar-button,.a-orientation-modal{display:none !important;}

  /* ---------- hint pill ---------- */
  #hint{
    position:fixed;z-index:6;
    top:calc(14px + var(--safe-t));left:50%;transform:translateX(-50%);
    max-width:min(90vw,340px);
    padding:9px 17px;border-radius:999px;
    background:rgba(20,10,26,.62);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(246,238,221,.16);
    color:var(--cream);font-size:13.5px;letter-spacing:.015em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    box-shadow:0 6px 24px rgba(0,0,0,.4);
  }
  #hint.wrap{white-space:normal;border-radius:16px;text-align:center;line-height:1.5;}

  /* ---------- lyric line ---------- */
  #lyric-wrap{
    position:fixed;left:0;right:0;
    bottom:calc(7% + var(--safe-b));
    z-index:3;pointer-events:none;
    display:flex;justify-content:center;padding:0 7vw;
  }
  #lyric{
    max-width:24ch;
    text-align:center;
    color:#FBF3E2;
    font-size:clamp(17px,3.1vh,30px);
    line-height:1.52;
    letter-spacing:.012em;
    text-shadow:0 2px 18px rgba(20,8,30,.85), 0 0 50px rgba(20,8,30,.6);
    opacity:0;
    transform:translateY(10px);
    transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.7,.3,1);
  }
  #lyric.on{opacity:1;transform:translateY(0);}
  #lyric .np{
    display:block;
    font-size:.74em;
    color:#F0C877;
    opacity:.78;
    margin-top:.42em;
    letter-spacing:.02em;
  }

  /* ---------- opening card ---------- */
  #gate{
    position:fixed;inset:0;z-index:9;
    background:
      radial-gradient(120% 90% at 50% 38%, #3A1F3C 0%, #1A0E20 55%, #0B0A14 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2.4rem;padding:calc(6vh + var(--safe-t)) 8vw calc(6vh + var(--safe-b));
    text-align:center;
    transition:opacity 1.5s ease;
  }
  #gate.gone{opacity:0;pointer-events:none;}

  #gate .mark{width:min(140px,26vw);height:auto;opacity:.95;}

  #gate h1{
    margin:0;
    font-weight:400;
    font-size:clamp(30px,6.2vh,58px);
    line-height:1.14;
    color:var(--cream);
    letter-spacing:.005em;
  }
  #gate h1 em{
    display:block;font-style:italic;
    color:var(--gold);
    font-size:.56em;
    margin-top:.5em;
    letter-spacing:.05em;
    opacity:.9;
  }
  #gate p{
    margin:0;max-width:30ch;
    color:#C9B4C6;font-size:clamp(14px,2.1vh,18px);line-height:1.6;
  }
  #begin{
    font-family:inherit;
    cursor:pointer;
    border:1px solid rgba(232,180,74,.5);
    background:rgba(232,180,74,.07);
    color:var(--gold);
    font-size:clamp(15px,2.3vh,19px);
    letter-spacing:.09em;
    padding:.95em 2.6em;
    border-radius:999px;
    transition:background .35s ease, transform .35s ease, border-color .35s ease;
  }
  #begin:hover,#begin:focus-visible{
    background:rgba(232,180,74,.16);
    border-color:rgba(232,180,74,.85);
    transform:translateY(-2px);
    outline:none;
  }
  #begin:focus-visible{box-shadow:0 0 0 3px rgba(232,180,74,.35);}

  /* ---------- controls ---------- */
  #hud{
    position:fixed;z-index:5;
    top:calc(14px + var(--safe-t));right:14px;
    display:flex;gap:9px;opacity:0;transition:opacity .8s ease;
  }
  #hud.on{opacity:.55;}
  #hud:hover{opacity:1;}
  .btn{
    width:40px;height:40px;border-radius:50%;cursor:pointer;
    border:1px solid rgba(246,238,221,.25);
    background:rgba(20,10,26,.42);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    color:var(--cream);
    display:grid;place-items:center;padding:0;
    transition:background .3s ease,border-color .3s ease;
  }
  .btn:hover,.btn:focus-visible{background:rgba(20,10,26,.75);border-color:rgba(246,238,221,.6);outline:none;}
  .btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .btn.off{opacity:.45;}

  /* ---------- end card ---------- */
  /* sits where the lyrics sat, so it never lands on top of the diorama */
  #endcard{
    position:fixed;inset:0;z-index:4;
    display:flex;align-items:flex-end;justify-content:center;
    pointer-events:none;opacity:0;transition:opacity 2.2s ease;
  }
  #endcard.on{opacity:1;}
  #endcard .inner{text-align:center;padding:0 10vw calc(11% + var(--safe-b));}
  #endcard .q{
    color:#FBF3E2;font-size:clamp(20px,3.6vh,36px);line-height:1.45;
    text-shadow:0 2px 24px rgba(20,8,30,.9);
  }

  /* ---------- the letter ---------- */
  #love{
    position:fixed;z-index:6;
    right:16px;bottom:calc(13% + var(--safe-b));
    width:62px;height:62px;border-radius:50%;cursor:pointer;
    border:1px solid rgba(232,180,74,.55);
    background:radial-gradient(120% 120% at 34% 26%,rgba(240,137,43,.3),rgba(20,10,26,.72));
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    color:var(--gold);
    display:grid;place-items:center;padding:0;
    box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 26px rgba(232,180,74,.22);
    opacity:0;transform:scale(.72);pointer-events:none;
    transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1);
  }
  #love.on{opacity:1;transform:scale(1);pointer-events:auto;animation:breathe 2.6s ease-in-out infinite;}
  #love svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;}
  @keyframes breathe{
    0%,100%{box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 22px rgba(232,180,74,.2);}
    50%    {box-shadow:0 12px 36px rgba(0,0,0,.5), 0 0 40px rgba(232,180,74,.46);}
  }

  /* ---------- the question ---------- */
  #final{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1.9rem;padding:calc(7vh + var(--safe-t)) 9vw calc(7vh + var(--safe-b));
    text-align:center;
    background:
      radial-gradient(118% 88% at 50% 34%,rgba(123,31,50,.78) 0%,rgba(26,14,32,.93) 58%,rgba(11,10,20,.97) 100%);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    animation:lift 1.1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes lift{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  /* while she is reading the question, nothing else should be competing for the eye */
  body.asking #endcard,body.asking #lyric-wrap,body.asking #hud{opacity:0;transition:opacity .5s ease;}
  #finalLead{
    margin:0;max-width:22ch;
    color:#C9B4C6;font-size:clamp(14px,2.1vh,18px);line-height:1.62;font-style:italic;
  }
  #finalQ{
    margin:0;max-width:17ch;
    color:var(--cream);font-size:clamp(27px,5.4vh,50px);line-height:1.22;
    text-shadow:0 2px 26px rgba(20,8,30,.9),0 0 60px rgba(240,137,43,.26);
  }
  #finalNp{
    display:block;margin-top:.55em;
    font-size:.42em;color:#F0C877;opacity:.8;letter-spacing:.03em;
  }
  #yesBtn{
    font-family:inherit;cursor:pointer;
    border:1px solid rgba(232,180,74,.6);
    background:rgba(232,180,74,.1);
    color:var(--gold);
    font-size:clamp(16px,2.5vh,21px);letter-spacing:.1em;
    padding:.92em 3.1em;border-radius:999px;
    transition:background .35s ease,transform .35s ease,border-color .35s ease;
  }
  #yesBtn:hover,#yesBtn:focus-visible{
    background:rgba(232,180,74,.2);border-color:rgba(232,180,74,.95);
    transform:translateY(-2px);outline:none;
  }
  #yesBtn:active{transform:scale(.96);}
  #finalReply{
    min-height:1.6em;
    color:#F0C877;font-size:clamp(15px,2.3vh,20px);font-style:italic;
    opacity:0;transition:opacity 1s ease;
  }
  #finalReply.on{opacity:1;}
  #closeBtn{
    font-family:inherit;cursor:pointer;background:none;border:0;
    color:#C9B4C6;opacity:.6;font-size:13px;letter-spacing:.05em;
    text-decoration:underline;text-underline-offset:4px;padding:6px;
  }
  .petal{
    position:fixed;top:-7vh;z-index:11;pointer-events:none;
    animation:fall linear forwards;
  }
  .petal svg{display:block;width:100%;height:100%;overflow:visible;}
  @keyframes fall{
    to{transform:translate3d(var(--dx),116vh,0) rotate(var(--rot));opacity:.1;}
  }

  #diag{
    position:fixed;left:6px;top:6px;z-index:999;
    background:rgba(0,0,0,.78);color:#9f9;
    font:11px/1.35 ui-monospace,monospace;
    padding:6px 8px;border-radius:6px;max-width:76vw;
    white-space:pre;pointer-events:none;
  }

  /* ---------- ?demo scrub bar ---------- */
  #demoBar{
    position:fixed;left:0;right:0;bottom:0;z-index:8;
    display:flex;gap:10px;align-items:center;padding:9px 12px;
    background:rgba(11,10,20,.72);color:var(--cream);
    font:12px/1.3 ui-monospace,monospace;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  #demoBar input{flex:1;}
  #demoBar button{
    font:inherit;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;
    background:var(--gold);color:#2A1B2E;
  }

  @media (prefers-reduced-motion: reduce){
    #lyric{transition-duration:.01ms;}
    #love.on{animation:none;}
  }
</style>
</head>
<body>

<!-- MindAR's scene lives here. It must fill the viewport — see the #stage rule above. -->
<div id="stage"></div>

<div id="lyric-wrap"><div id="lyric"></div></div>

<div id="endcard"><div class="inner"><div class="q" id="endq"></div></div></div>

<div id="hud">
  <button class="btn" id="btnSound" title="Sound" aria-label="Toggle sound">
    <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="wave1" d="M16.5 8.5a5 5 0 0 1 0 7"/><path id="wave2" d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
  </button>
  <button class="btn" id="btnReplay" title="Play again" aria-label="Play again">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4h-4"/></svg>
  </button>
</div>

<div id="hint" hidden></div>

<!-- the letter, folded shut until the end of the song -->
<button id="love" aria-label="Open the letter">
  <svg viewBox="0 0 24 24">
    <rect x="2.4" y="5.4" width="19.2" height="13.2" rx="1.8"/>
    <path d="M2.4 7 12 13.4 21.6 7"/>
    <path d="M2.8 18.2 9.3 12M21.2 18.2 14.7 12" opacity=".55"/>
  </svg>
</button>

<div id="final" hidden>
  <p id="finalLead"></p>
  <h2 id="finalQ"></h2>
  <button id="yesBtn"></button>
  <div id="finalReply"></div>
  <button id="closeBtn">back to the hills</button>
</div>

<div id="demoBar" hidden>
  <button id="dPlay">play / pause</button>
  <input id="dSeek" type="range" min="0" step="0.1" value="0">
  <span id="dTime">0.0s</span>
</div>

<div id="gate">
  <svg class="mark" viewBox="0 0 120 120" aria-hidden="true">
    <g fill="none" stroke="#E8B44A" stroke-width="1.5" stroke-linecap="round">
      <path d="M8 86 L34 52 L46 66 L62 38 L78 62 L92 46 L112 76" stroke-opacity=".55"/>
      <path d="M8 86 H112" stroke-opacity=".3"/>
    </g>
    <g id="markPetals" fill="#E8B44A" opacity=".85"></g>
  </svg>
  <h1>Timro Lagi<em>तिम्रो लागि</em></h1>
  <p id="gateNote">Tap, and hold your camera over the card.</p>
  <button id="begin">Begin</button>
</div>

<audio id="song" preload="auto"></audio>

<script>
/* ============================================================
   ✦ EVERYTHING YOU'LL WANT TO EDIT LIVES IN THIS ONE BLOCK ✦
   (unchanged from the 2D build, except the `ar` section, which
    now describes a solid diorama instead of stacked planes)
   ============================================================ */
const CONFIG = {

  // Her name. Appears in gold inside the marigold garland at the end.
  herName: "Shalini",

  // The last line she reads, on screen just before the letter appears.
  finalWords: "Timi bina mero bhawisya chainan.",

  // Drop your song next to this file and put the filename here.
  // e.g. "song.mp3". Leave "" to run the scene silently.
  audioFile: "music.m4a",

  // Seconds into the song that the animation should start from.
  audioOffset: 0,

  // ---- the letter at the end ----
  letter: {
    lead:  "I walked every hill just to ask you this —",
    ask:   "Will you go on a first date with me?",
    np:    "पहिलो भेट?",
    yes:   "Yes",
    reply: "Then it's a promise."
  },

  // ---- how the diorama sits on the card ----
  // Inside the anchor 1 unit = the card's width, so everything here is in card widths.
  ar: {
    target: "targets.mind",  // compiled from the card image (mountains.png)
    scale:  0.95,            // how wide the island is, in card widths
    // The angle you look DOWN on the island at. A diorama standing straight out of the card
    // (90) is only flattering when the card is lying flat; held up, you stare down its own
    // "up" axis and get a map. So it leans to meet you — see updateTilt.
    tilt:     38,
    tiltAuto: true,
    // How tall the landform stands off the card. 1.0 is a dramatic alpine spire; lower makes
    // a calmer, wider diorama. Nothing else needs touching — hills, peaks and shoulders all
    // scale together, and everything standing on them re-seats itself.
    relief:   0.82,
    lift:     0.0            // extra float above the card face
  },

  // Lyric cues — { t: seconds, line: "romanised", np: "Devanagari (optional)" }
  // Retune `t` to match wherever these land in your audio.
  lyrics: [
    { t:  5.0, line: "Timro lagi ma sadhai hune chu" },
    { t: 12.5, line: "Pahaad chadhne, nadi tarne, sansaar ghumne sangai" },
    { t: 25.0, line: "Dakshinkali aako chu dhokera pyari", np: "दक्षिणकाली" },
    { t: 32.0, line: "Timlai paune sapana bokera" },
    { t: 41.0, line: "Timro ankha ko gahirai ma malai dubna deuna" },
    { t: 49.0, line: "Timro sapana ma kahile kahi malai auna deuna" },
    { t: 58.5, line: "Maayaale sajaaera eutaa ghar basaaune chu timilai" },
    { t: 68.0, line: "Timraa sapanaa meraa sapanaa hunchhan eutai pyaari", np: "माया" }
  ],

  // Beat timings (seconds). Shift these to fit your song.
  beats: {
    fadeIn:      0.0,
    walkOne:     2.0,   // starts climbing
    reachTemple: 21.0,  // arrives at Dakshinkali
    kneelDown:   24.0,  // kneels, lights the diya
    riseUp:      34.0,  // stands, bows
    walkTwo:     38.0,  // climbs on; dusk falls, fireflies rise
    reachHome:   56.0,  // arrives at the doorstep
    houseLights: 57.0,  // a second later, every window lights at once
    turnAround:  58.5,  // turns to face her
    kneelOffer:  60.5,  // one knee, holds out the lali gurans
    garland:     72.0,  // marigolds bloom into her name
    finalLine:   80.0,
    hold:        92.0
  }
};
</script>
<script>
/* ============================================================
   build id + escape hatches

   Every one of these exists so a hypothesis can be tested in seconds by someone holding a
   phone, with no rebuild. Put the build id on screen: GitHub Pages plus phone caching makes
   "is this even the new version?" a question worth answering at a glance.
   ============================================================ */
const BUILD = 'hd1';
const QS    = new URLSearchParams(location.search);
const DEMO  = QS.has('demo');          // no camera: orbit the diorama on a desktop
const DEBUG = QS.has('debug');         // on-screen diagnostics
// ?lite strips shadows, the env map and the small scatter. The perf escape hatch.
const LITE  = QS.has('lite') && !QS.has('full');
const TILT_FIXED = QS.has('tilt') ? +QS.get('tilt') : null;

const THREE = AFRAME.THREE;
const MOBILE = (AFRAME.utils.device && AFRAME.utils.device.isMobile && AFRAME.utils.device.isMobile())
  || (window.matchMedia && matchMedia('(pointer:coarse)').matches && Math.min(screen.width, screen.height) < 820);
const REDUCED = matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ============================================================
   small helpers
   ============================================================ */
const $ = id => document.getElementById(id);

// Phones have no devtools. Surface anything uncaught on screen so it can be read out loud.
function showDiag(msg){
  try{
    const h = $("hint"); if (!h) return;
    h.textContent = "⚠ " + msg; h.classList.add("wrap"); h.hidden = false;
  }catch(e){}
}
addEventListener("error", e =>
  showDiag((e.message||"script error") + " @" + ((e.filename||"").split("/").pop()) + ":" + e.lineno));
addEventListener("unhandledrejection", e =>
  showDiag("promise: " + ((e.reason && e.reason.message) || e.reason || "rejected")));

const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
const inv   = (a,b,v) => clamp((v-a)/(b-a), 0, 1);
// smoothstep-eased progress between two times
const ramp  = (a,b,v) => { const t = inv(a,b,v); return t*t*(3-2*t); };
// walking progress: a steady pace with a short speed-up and slow-down at each end
// (smoothstep spends its last seconds crawling, which reads as stepping on the spot)
const stroll = (a,b,v,e=1.2) => {
  const T = b-a, s = clamp(v-a, 0, T); e = Math.min(e, T/2);
  const vm = 1/(T-e);
  if (s < e)   return 0.5*vm*s*s/e;
  if (s > T-e) return 1 - 0.5*vm*(T-s)*(T-s)/e;
  return vm*(s - e/2);
};
const easeOutBack = t => { t=clamp(t,0,1); const c=1.70158+1; return 1 + c*Math.pow(t-1,3) + 1.70158*Math.pow(t-1,2); };
const easeOutExpo = t => { t=clamp(t,0,1); return t>=1 ? 1 : 1-Math.pow(2,-10*t); };
// gentle overshoot/settle spring
const spring = t => { t=clamp(t,0,1); return 1 - Math.cos(t*Math.PI*1.5)*Math.exp(-3*t); };
// frame-rate independent exponential smoothing
const damp = (a,b,l,dt) => lerp(a, b, 1 - Math.exp(-l*dt));
const shortAngle = (from, to) => Math.atan2(Math.sin(to-from), Math.cos(to-from));

// deterministic pseudo-random so the scene looks identical every run
let _seed = 20260214;
const rnd = () => { _seed = (_seed*1664525 + 1013904223) % 4294967296; return _seed/4294967296; };
const rr  = (a,b) => a + rnd()*(b-a);
function rng(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed>>>15, 1|seed);
    t = t + Math.imul(t ^ t>>>7, 61|t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

const mix = (c1, c2, t) => {
  const p = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const [r1,g1,b1]=p(c1), [r2,g2,b2]=p(c2);
  const h2 = v => Math.round(v).toString(16).padStart(2,"0");
  return "#"+h2(lerp(r1,r2,t))+h2(lerp(g1,g2,t))+h2(lerp(b1,b2,t));
};

/* ============================================================
   the clock

   The scene used to run off performance.now(), which drifts away from the song within a
   minute. Drive it from the audio element's own currentTime instead, and fall back to a
   silent counter if the file is missing so the story still plays.
   ============================================================ */
const P = {
  audio: $("song"), audioOK:false, playing:false, clock:0, t:0, _live:false,
  init(){
    const a = this.audio;
    if (!CONFIG.audioFile) return;
    a.preload = "auto"; a.loop = false; a.src = CONFIG.audioFile;
    a.addEventListener("canplay", ()=>{
      if (this.audioOK) return;
      this.audioOK = true;
      try{ a.currentTime = this.clock + (CONFIG.audioOffset||0); }catch(e){}
      if (this.playing) a.play().catch(()=>{});
    });
    a.addEventListener("error", ()=>{
      this.audioOK = false;
      console.warn("song not found — running on a silent clock");
    });
  },
  // called inside the Begin tap, so a mobile browser will let us play audio later on
  unlock(){
    const a = this.audio; if (!CONFIG.audioFile) return;
    const p = a.play();
    if (p && p.then) p.then(()=>{
      if (!this.playing){ a.pause(); try{ a.currentTime = CONFIG.audioOffset||0; }catch(e){} }
    }).catch(()=>{});
  },
  play(){ this.playing = true; if (this.audioOK) this.audio.play().catch(()=>{}); },
  pause(){ this.playing = false; if (this.audioOK) this.audio.pause(); },
  seek(s){
    this.clock = s; this.t = s; this._live = false;
    if (this.audioOK){ try{ this.audio.currentTime = s + (CONFIG.audioOffset||0); }catch(e){} }
  },
  update(dt){
    // 'canplay' fired is not the same as the song actually playing. If the file never finishes
    // buffering, or the browser quietly refuses to start it, currentTime sits at 0 for ever —
    // and a clock that never advances means a blank card and a story that never begins. So run
    // the silent counter until the audio is demonstrably producing time, then hand over to it.
    const a = this.audio;
    const live = this.audioOK && !a.paused && a.currentTime > 0;
    if (live){
      if (!this._live){                   // the first frame the song actually speaks
        this._live = true;
        const want = this.clock + (CONFIG.audioOffset||0);
        // don't let the picture jump back to wherever the audio happened to start
        if (Math.abs(a.currentTime - want) > 0.35){ try{ a.currentTime = want; }catch(e){} }
      }
      this.t = a.currentTime - (CONFIG.audioOffset||0); this.clock = this.t;
    } else {
      this._live = false;
      if (this.playing){ this.clock += dt; this.t = this.clock; }
    }
  }
};

   lyrics
   ============================================================ */
let lyricIdx = -1;
let lyricGen = 0;
function updateLyrics(t){
  let want = -1;
  for (let i=0;i<CONFIG.lyrics.length;i++){
    const L = CONFIG.lyrics[i];
    const nxt = CONFIG.lyrics[i+1];
    const end = Math.min(L.t + 6.4, nxt ? nxt.t - 0.5 : 1e9);
    if (t >= L.t && t < end) want = i;
  }
  if (want === lyricIdx) return;
  lyricIdx = want;
  const box = $("lyric");
  // The swap waits 240ms for the old line to fade out. Stamp it, so a pending swap that has
  // been overtaken — by the next line, or by the last one ending — can't put a dead lyric back
  // on screen after it should be gone.
  const gen = ++lyricGen;
  if (want < 0){ box.classList.remove("on"); return; }
  const L = CONFIG.lyrics[want];
  box.classList.remove("on");
  setTimeout(()=>{
    if (gen !== lyricGen) return;
    box.innerHTML = L.line + (L.np ? '<span class="np">' + L.np + '</span>' : "");
    box.classList.add("on");
  }, 240);
}

/* ============================================================
   merging — one draw call instead of three hundred

   A-Frame doesn't ship BufferGeometryUtils, and a phone will not thank you for 260 separate
   grass tufts. This pours many little geometries into one buffer, baking a transform and a
   colour into each.
   ============================================================ */
function Merger(){ this.pos = []; this.col = []; }
Merger.prototype.add = function(geo, matrix, color){
  const g = geo.index ? geo.toNonIndexed() : geo;
  const p = g.attributes.position;
  const v = new THREE.Vector3();
  const c = new THREE.Color(color);
  for (let i=0;i<p.count;i++){
    v.fromBufferAttribute(p, i);
    if (matrix) v.applyMatrix4(matrix);
    this.pos.push(v.x, v.y, v.z);
    this.col.push(c.r, c.g, c.b);
  }
  if (g !== geo) g.dispose();
  return this;
};
// a bare triangle, for things with no primitive that fits (grass blades, ridge faces)
Merger.prototype.tri = function(a, b, c, color){
  const col = new THREE.Color(color);
  [a,b,c].forEach(v => { this.pos.push(v[0],v[1],v[2]); this.col.push(col.r,col.g,col.b); });
  return this;
};
Merger.prototype.quad = function(a, b, c, d, color){
  this.tri(a,b,c,color); this.tri(a,c,d,color); return this;
};
Merger.prototype.build = function(){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
  g.setAttribute('color',    new THREE.Float32BufferAttribute(this.col, 3));
  g.computeVertexNormals();
  return g;
};
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler();
function TRS(px,py,pz, rx,ry,rz, sx,sy,sz){
  _e.set(rx||0, ry||0, rz||0);
  _q.setFromEuler(_e);
  return new THREE.Matrix4().compose(
    new THREE.Vector3(px,py,pz), _q,
    new THREE.Vector3(sx===undefined?1:sx, sy===undefined?(sx===undefined?1:sx):sy, sz===undefined?(sx===undefined?1:sx):sz));
}

/* ============================================================
   the land

   The 2D build walked left to right across a 3400-unit strip. Standing on a card the same
   journey has to fold up, so the trail switches back up a hillside instead: meadow and river
   at the front, the shrine on the right shoulder, the house on the back shelf, and the
   Himalaya across the back edge. Same stations, same order, one island you can walk around.

   Units: 1 = the card's width. The island is a little deeper than it is wide.
   ============================================================ */
const ISX = 1.0, ISZ = 1.18;
const RELIEF = CONFIG.ar.relief === undefined ? 1 : CONFIG.ar.relief;
const HOUSE_P  = {x:-0.055, z:-0.270};
const TEMPLE_P = {x: 0.300, z: 0.020};
const RIVER_Z  = 0.255;

const riverZ = x => RIVER_Z + Math.sin(x*4.1)*0.030 + Math.sin(x*9.3 + 1.2)*0.013;

// the raw hillside, before anything is levelled into it
function H0(x, z){
  const back = -z;                                  // 0 at the middle, + toward the back
  let h = 0.215 * ramp(-0.42, 0.40, back);          // the long climb
  h += 0.075 * ramp(0.24, 0.40, back);              // the shelf the house stands on
  h += 0.135 * ramp(0.40, 0.58, back);              // the foot of the range
  // shoulders closing the valley in on both sides
  h += 0.150 * ramp(0.20, 0.50, Math.abs(x)) * ramp(-0.30, 0.30, back);
  // the river has cut a shallow gorge across the meadow
  const d = (z - riverZ(x)) / 0.080;
  h -= 0.052 * Math.exp(-d*d);
  // and the ground is never flat
  h += 0.0085*Math.sin(x*8.7 + 1)*Math.cos(z*6.3) + 0.0045*Math.sin(x*17 + z*13);
  return h * RELIEF;
}
const HOUSE_Y  = H0(HOUSE_P.x,  HOUSE_P.z);
const TEMPLE_Y = H0(TEMPLE_P.x, TEMPLE_P.z);

// level a pad under the two buildings so they aren't standing on a slope
function pad(h, x, z, p, y, r){
  const m = 1 - ramp(r*0.5, r, Math.hypot(x-p.x, z-p.z));
  return lerp(h, y, m);
}
function H(x, z){
  let h = H0(x, z);
  h = pad(h, x, z, HOUSE_P,  HOUSE_Y,  0.115);
  h = pad(h, x, z, TEMPLE_P, TEMPLE_Y, 0.115);
  return h;
}
const slopeAt = (x,z,dx,dz) => (H(x+dx, z+dz) - H(x-dx, z-dz));

/* the trail — the one line everything else is arranged around.
   Switchbacks, because that is what a hill trail does and because the climb has to be long
   enough that the shrine falls at the same point in the walk as it does on the card: a little
   past half way (1760 of 2900 units there; u = 0.54 here). */
const TRAIL = [
  [ 0.27,  0.55], [ 0.09,  0.37], [ 0.07,  0.255], [-0.07,  0.17],
  [-0.22,  0.10], [-0.05,  0.055], [ 0.14,  0.015],
  // from the shrine, one last zigzag up the slope, arriving from the right — it never
  // runs on past the house and doubles back
  [ 0.00, -0.05], [ 0.13, -0.11], [ 0.06, -0.175],
  [-0.031,-0.180]     // the doorstep: in front of the step, never through the walls
];

/* the Himalaya. These are the 2D build's own PEAKS, in its own coordinates — the skyline on
   the card and the skyline on the island are literally the same ridgeline. */
const PEAKS = [
  [-600,600],[-300,520],[-120,470],[0,424],[90,300],[170,392],[250,356],
  [330,188],[402,302],[470,266],[540,332],[620,230],[700,322],[790,280],
  [858,150],[882,196],[912,132],[992,292],[1060,250],[1140,332],
  [1220,204],[1300,312],[1390,268],[1470,362],[1560,238],[1660,330],
  [1760,300],[1900,398],[2080,350],[2300,430],[2500,600]
];
// sample that silhouette as a height in card units, u running 0..1 across the range
function peakProfile(u){
  const px = lerp(PEAKS[0][0], PEAKS[PEAKS.length-1][0], clamp(u,0,1));
  let y = PEAKS[PEAKS.length-1][1];
  for (let i=0;i<PEAKS.length-1;i++){
    const [x0,y0] = PEAKS[i], [x1,y1] = PEAKS[i+1];
    if (px >= x0 && px <= x1){ y = lerp(y0, y1, (px-x0)/(x1-x0)); break; }
  }
  return (600 - y) / 468;                 // 0 at the valley floor, 1 at the highest peak
}
// a ridgeline in the manner of the 2D build's hills: three sines, decreasing in size
function ridgeProfile(shift, amp, period, u){
  const x = u*3000;
  return 0.5 + (Math.sin((x+shift)*0.00085*period)
              + Math.sin((x+shift*1.7)*0.0021*period)*0.42
              + Math.sin((x+shift*0.6)*0.0049*period)*0.17) * amp;
}

<script>
/* ============================================================
   the ground
   ============================================================ */
const GRID = MOBILE || LITE ? 68 : 92;

// what colour the hillside is at a given point: grass low down, drying to khaki as it climbs,
// bare rock on the shoulders, a cap of snow on the very tops. The 2D build's hillNear gradient,
// unrolled into three dimensions.
const _c1 = new THREE.Color(), _c2 = new THREE.Color();
const C_GRASS = new THREE.Color(PAL.grass),     C_GRASSD = new THREE.Color(PAL.grassMid);
const C_KHAKI = new THREE.Color("#8E9A54"),     C_ROCK   = new THREE.Color(PAL.rockLit);
const C_ROCKD = new THREE.Color(PAL.rockMid),   C_SNOW   = new THREE.Color(PAL.snowLit);
const C_BED   = new THREE.Color("#6E6B57"),     C_TERR   = new THREE.Color(PAL.terrA);

function groundColor(x, z, h, out){
  out.copy(C_GRASS).lerp(C_GRASSD, ramp(-0.02, 0.10, h) * 0.45);
  out.lerp(C_KHAKI, ramp(0.14, 0.30, h));
  out.lerp(C_ROCK,  ramp(0.30, 0.44, h) * 0.9);
  out.lerp(C_ROCKD, ramp(0.40, 0.52, h) * 0.6);
  out.lerp(C_SNOW,  ramp(0.48, 0.58, h));
  // the terraced flank, left of the trail
  const terr = ramp(0.26, 0.40, -x) * ramp(-0.22, -0.12, -z) * (1 - ramp(0.16, 0.26, -z));
  out.lerp(C_TERR, terr * 0.5);
  // the river bed, scoured and wet
  const d = (z - riverZ(x)) / 0.075;
  out.lerp(C_BED, Math.exp(-d*d) * 0.7);
  return out;
}

  tg.rotateX(-Math.PI/2);

  for (let i=0;i<p.count;i++){
    const x = p.getX(i), z = p.getZ(i), h = H(x, z);
    p.setY(i, h);
    groundColor(x, z, h, tmp);
    cols[i*3] = tmp.r; cols[i*3+1] = tmp.g; cols[i*3+2] = tmp.b;
  }
  tg.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  tg.computeVertexNormals();
  const terrain = new THREE.Mesh(tg, new THREE.MeshStandardMaterial({
    vertexColors:true, flatShading:true, roughness:1, metalness:0, envMapIntensity:.3}));
  terrain.receiveShadow = true;
  root.add(terrain);

  /* the earth skirt — what turns a patch of hillside into a thing standing on a card */
  const N = GRID, per = [], hx = ISX/2, hz = ISZ/2;
  for (let i=0;i<=N;i++) per.push([-hx + ISX*i/N,  hz]);
  for (let i=1;i<=N;i++) per.push([ hx,            hz - ISZ*i/N]);
  for (let i=1;i<=N;i++) per.push([ hx - ISX*i/N, -hz]);
  for (let i=1;i<=N;i++) per.push([-hx,          -hz + ISZ*i/N]);
  const M = new Merger(), BOT = -0.062;
  const cTop = PAL.earth, cMid = "#5A3E2C", cBot = PAL.earthDeep;
  for (let i=0;i<per.length-1;i++){
    const a = per[i], b = per[i+1];
    const ha = H(a[0], a[1]), hb = H(b[0], b[1]);
    const ma = lerp(ha, BOT, 0.45), mb = lerp(hb, BOT, 0.45);
    // two bands, so the cliff reads as soil over rock rather than one flat wall
    M.quad([a[0],ha,a[1]], [b[0],hb,b[1]], [b[0],mb,b[1]], [a[0],ma,a[1]], cTop);
    M.quad([a[0],ma,a[1]], [b[0],mb,b[1]], [b[0],BOT,b[1]], [a[0],BOT,a[1]],
           (i & 2) ? cMid : cBot);
  }
  const skirt = new THREE.Mesh(M.build(), new THREE.MeshStandardMaterial({
    vertexColors:true, flatShading:true, side:THREE.DoubleSide, roughness:1, envMapIntensity:.25}));
  skirt.receiveShadow = true;
  root.add(skirt);

  const under = new THREE.Mesh(new THREE.PlaneGeometry(ISX, ISZ),
    new THREE.MeshStandardMaterial({color:"#2E211B", roughness:1}));
  under.rotation.x = Math.PI/2; under.position.y = BOT;
  root.add(under);
}

/* ---- terraced paddy, cut into the left flank ----
   The 2D build drew these as eleven contour strokes on the mid hills. Here they are real
   shelves with real risers, which is what they are on a hill above Kathmandu. */
function buildTerraces(root){
  const M = new Merger(), K = 8, X0 = -0.455, X1 = -0.300, S = 14;
  for (let k=0;k<K;k++){
    const zb = lerp(0.115, -0.185, k/(K-1));   // uphill edge
    const zf = zb + 0.040;                     // the lip it falls off
    const top = k % 2 ? PAL.terrA : PAL.terrB;
    for (let i=0;i<S;i++){
      const xa = lerp(X0, X1, i/S), xb = lerp(X0, X1, (i+1)/S);
      const ya = H(xa, zb) + 0.003, yb = H(xb, zb) + 0.003;
      const fa = H(xa, zf),         fb = H(xb, zf);
      if (ya - fa < 0.002) continue;           // no step worth building here
      M.quad([xa,ya,zb], [xb,yb,zb], [xb,yb,zf], [xa,ya,zf], top);          // the flooded shelf
      M.quad([xa,ya,zf], [xb,yb,zf], [xb,fb-0.004,zf], [xa,fa-0.004,zf],    // the stone riser
             k % 2 ? "#7A6646" : "#6B5A3E");
    }
  }
  const m = new THREE.Mesh(M.build(), new THREE.MeshStandardMaterial({
    vertexColors:true, flatShading:true, side:THREE.DoubleSide, roughness:.95, envMapIntensity:.3}));
  m.receiveShadow = true; root.add(m);
}

/* ============================================================
   the Himalaya

   A range built as a real landform — a crest with a lit face falling toward the valley and a
   shaded one falling away behind — rather than a flat cut-out, so it still reads as mountains
   when she walks around the card.
   ============================================================ */
function buildRidge(o){
  const M = new Merger(), N = o.N || 72;
  const dx = o.b[0]-o.a[0], dz = o.b[1]-o.a[1];
  const L = Math.hypot(dx, dz) || 1;
  const nx = -dz/L, nz = dx/L;                 // unit normal: the way the lit face looks
  const hazeC = new THREE.Color(o.haze || "#C98C7E");
  const col = new THREE.Color();
  const tint = (hex, hN, lit) => {
    col.set(hex);
    if (!lit) col.multiplyScalar(0.72);
    // aerial perspective: the foot of the range dissolves into the haze
    col.lerp(hazeC, (o.hazeAmt === undefined ? 0.5 : o.hazeAmt) * (1 - clamp(hN*1.5,0,1)));
    return col.getHex();
  };
  const row = [];
  for (let i=0;i<=N;i++){
    const u = i/N;
    const hN = clamp(o.prof(u), 0, 1);
    // high crests sit a little further back, saddles pull forward
    const off = (hN - 0.45) * (o.wob || 0.05);
    const cx = o.a[0] + dx*u - nx*off, cz = o.a[1] + dz*u - nz*off;
    const fx = cx + nx*o.depth,      fz = cz + nz*o.depth;
    const bx = cx - nx*(o.back||o.depth), bz = cz - nz*(o.back||o.depth);
    row.push({
      hN,
      c:[cx, H(cx,cz) + (o.lift||0) + hN*o.hMax, cz],
      f:[fx, H(fx,fz) + 0.002, fz],
      k:[bx, H(bx,bz) + 0.002, bz]
    });
  }
  for (let i=0;i<N;i++){
    const a = row[i], b = row[i+1];
    const hN = (a.hN + b.hN) * 0.5;
    // Snow caps the crests only: above the snowline the top of each face turns white, deeper
    // on the higher peaks and ragged from one strip to the next, and bare rock runs on below.
    const sn = ramp(o.snow - 0.06, o.snow + 0.06, hN);
    const cap = sn * clamp(0.22 + (hN - o.snow)*1.6, 0.16, 0.62) * (0.8 + 0.4*(Math.sin(i*12.9898 + o.snow*78.233)*0.5 + 0.5));
    const rockLit = tint(o.rockLit, hN, true), rockShade = tint(o.rockDark, hN, false);
    if (cap < 0.02){
      M.quad(a.c, b.c, b.f, a.f, rockLit);
      M.quad(b.c, a.c, a.k, b.k, rockShade);
      continue;
    }
    const at = (p, q, k) => [lerp(p[0],q[0],k), lerp(p[1],q[1],k), lerp(p[2],q[2],k)];
    const af = at(a.c, a.f, cap), bf = at(b.c, b.f, cap);
    const ak = at(a.c, a.k, cap), bk = at(b.c, b.k, cap);
    M.quad(a.c, b.c, bf, af, tint(o.snowLit,   hN, true));
    M.quad(af,  bf,  b.f, a.f, rockLit);
    M.quad(b.c, a.c, ak, bk, tint(o.snowShade, hN, false));
    M.quad(bk,  ak,  a.k, b.k, rockShade);
  }
  const mesh = new THREE.Mesh(M.build(), new THREE.MeshStandardMaterial({
    vertexColors:true, flatShading:true, side:THREE.DoubleSide,
    roughness:o.rough === undefined ? 0.95 : o.rough, metalness:0,
    envMapIntensity:o.env === undefined ? 0.35 : o.env}));
  mesh.castShadow = !!o.shadow && !LITE;
  mesh.receiveShadow = true;
  return {mesh, row, nx, nz};
}

function buildRanges(root){
  const out = {};
  // Everything here is kept inside the island's own footprint. A range whose foot hangs off
  // the edge has nothing under it, and in AR you see straight through to the camera feed.
  // 1. the snow range across the back — the card's own skyline, in three dimensions
  out.snow = buildRidge({
    a:[-0.49,-0.435], b:[0.49,-0.485], N: MOBILE?84:120, depth:0.095, back:0.085, wob:0.035,
    prof:u => peakProfile(u)*0.94 + 0.016*Math.sin(u*41), hMax:0.42*RELIEF, snow:0.50,
    snowLit:PAL.snowLit, snowShade:PAL.snowShade, rockLit:PAL.rockLit, rockDark:PAL.rockDark,
    haze:"#C98C7E", hazeAmt:0.46, shadow:true, rough:0.8, env:0.5
  });
  root.add(out.snow.mesh);

  // 2. a hazier wall behind it, filling the saddles so the range has somewhere to recede
  // into. It must stay BELOW the snow line: on the card the Himalaya is the highest layer and
  // everything else sits under it, and a back wall that out-tops the peaks inverts that.
  out.far = buildRidge({
    a:[-0.44,-0.525], b:[0.44,-0.540], N:56, depth:0.045, back:0.030, wob:0.02,
    // tapered at both ends so it dies away behind the shoulders instead of riding up on top
    // of them — that was what let it overtop the peaks
    prof:u => (ridgeProfile(400, 0.30, 1.0, u)*0.8 + 0.22) * (0.34 + 0.66*Math.sin(Math.PI*u)),
    hMax:0.20*RELIEF, lift:0.02*RELIEF, snow:0.58,
    snowLit:"#F2ECE6", snowShade:"#98A2BA", rockLit:PAL.hillFar, rockDark:PAL.hillFar2,
    haze:"#D6A091", hazeAmt:0.72, rough:1
  });
  root.add(out.far.mesh);

  // 3 & 4. the shoulders that close the valley in at the back. They stop short of the
  // mid-ground on purpose: the left flank is wanted open for the terraces, the right for the
  // shrine. (a -> b is ordered so the lit face looks into the valley.)
  out.left = buildRidge({
    a:[-0.345,-0.095], b:[-0.425,-0.455], N:40, depth:0.070, back:0.065, wob:0.035,
    prof:u => ridgeProfile(1500, 0.26, 1.6, u)*0.62 + 0.12, hMax:0.28*RELIEF, snow:0.72,
    snowLit:PAL.snowLit, snowShade:PAL.snowShade, rockLit:"#8A5440", rockDark:"#4E2E28",
    haze:"#8E7A72", hazeAmt:0.30, shadow:true
  });
  root.add(out.left.mesh);

  out.right = buildRidge({
    a:[0.425,-0.455], b:[0.345,-0.150], N:36, depth:0.070, back:0.065, wob:0.035,
    prof:u => ridgeProfile(2600, 0.24, 1.9, u)*0.58 + 0.12, hMax:0.25*RELIEF, snow:0.74,
    snowLit:PAL.snowLit, snowShade:PAL.snowShade, rockLit:"#84503E", rockDark:"#4A2C26",
    haze:"#8E7A72", hazeAmt:0.28, shadow:true
  });
  root.add(out.right.mesh);
  return out;
}

/* ---- pines, the way the 2D build scattered them: along every ridge ---- */
function pineInto(M, x, y, z, h, col, dark){
  const w = h*0.40;
  M.add(new THREE.CylinderGeometry(h*0.035, h*0.05, h*0.34, 5),
        TRS(x, y + h*0.17, z), dark);
  for (let k=0;k<3;k++){
    const r = w*(1 - k*0.26), hh = h*0.40;
    M.add(new THREE.ConeGeometry(r, hh, 7),
          TRS(x, y + h*(0.34 + k*0.21) + hh*0.5, z),
          k === 0 ? dark : col);
  }
}
function buildPines(root, ranges){
  const near = new Merger(), far = new Merger();
  const R = rng(77);
  // on the two shoulders, and on the near slope
  [["left", ranges.left, PAL.pineMid, "#22302E", 26],
   ["right", ranges.right, PAL.pineMid, "#22302E", 24]].forEach(([, rg, col, dark, n])=>{
    for (let i=0;i<n;i++){
      const t = R(), idx = Math.floor(t * (rg.row.length-1));
      const p = rg.row[idx];
      const s = 0.25 + R()*0.68;                                 // down the lit face
      const x = lerp(p.c[0], p.f[0], s), z = lerp(p.c[2], p.f[2], s);
      pineInto(near, x, H(x,z) - 0.004, z, 0.05 + R()*0.045, col, dark);
    }
  });
  // a dark fringe at the foot of the snow range
  for (let i=0;i<(LITE?14:30);i++){
    const u = R(), p = ranges.snow.row[Math.floor(u*(ranges.snow.row.length-1))];
    const s = 0.62 + R()*0.36;
    const x = lerp(p.c[0], p.f[0], s), z = lerp(p.c[2], p.f[2], s);
    pineInto(far, x, H(x,z) - 0.004, z, 0.042 + R()*0.04, PAL.pineNear, "#18231F");
  }
  // and a stand on the near hillside, clear of the trail
  for (let i=0, n=0; i<180 && n<(LITE?8:16); i++){
    const x = -0.47 + R()*0.94, z = -0.42 + R()*0.78;
    if (Math.hypot(x-HOUSE_P.x, z-HOUSE_P.z) < 0.17) continue;
    if (Math.hypot(x-TEMPLE_P.x, z-TEMPLE_P.z) < 0.17) continue;
    if (Math.abs(z - riverZ(x)) < 0.07) continue;
    if (nearTrail(x, z) < 0.085) continue;
    n++;
    pineInto(near, x, H(x,z) - 0.004, z, 0.045 + R()*0.05, "#36604A", "#243F33");
  }
  const m1 = new THREE.Mesh(near.build(), new THREE.MeshStandardMaterial({
    vertexColors:true, flatShading:true, roughness:.9, envMapIntensity:.3}));
  m1.castShadow = !LITE; m1.receiveShadow = true; root.add(m1);
  const m2 = new THREE.Mesh(far.build(), new THREE.MeshStandardMaterial({
    vertexColors:true, flatShading:true, roughness:1, envMapIntensity:.2}));
  m2.receiveShadow = true; root.add(m2);
}

/* ============================================================
   the trail, the river and the bridge
   ============================================================ */
let TRAIL_CURVE = null;
function nearTrail(x, z){
  if (!TRAIL_CURVE) return 9;
  let best = 9;
  for (let i=0;i<=30;i++){
    const p = TRAIL_CURVE.getPointAt(i/30);
    const d = Math.hypot(p.x-x, p.z-z);
    if (d < best) best = d;
  }
  return best;
}

// a flat band laid over the ground, following a curve
function ribbon(curve, width, yOff, material, S, uvRep){
  const pos = [], uv = [], idx = [];
  for (let i=0;i<=S;i++){
    const u = i/S, p = curve.getPointAt(u), t = curve.getTangentAt(u);
    let nx = -t.z, nz = t.x;
    const l = Math.hypot(nx, nz) || 1; nx /= l; nz /= l;
    [1,-1].forEach((s,k)=>{
      const x = p.x + nx*width/2*s, z = p.z + nz*width/2*s;
      pos.push(x, H(x,z) + yOff, z); uv.push(u*(uvRep||1), k);
    });
  }
  for (let i=0;i<S;i++){ const a = i*2; idx.push(a, a+2, a+1, a+1, a+2, a+3); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv',       new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  material.side = THREE.DoubleSide;
  return new THREE.Mesh(g, material);
}

function buildTrail(root){
  TRAIL_CURVE = new THREE.CatmullRomCurve3(TRAIL.map(p => new THREE.Vector3(p[0], 0, p[1])));
  const path = ribbon(TRAIL_CURVE, 0.052, 0.0045,
    new THREE.MeshStandardMaterial({color:PAL.trail, roughness:1, envMapIntensity:.25}), 140, 1);
  path.receiveShadow = true; root.add(path);
  // the sunlit lip the 2D build strokes along the crest of the trail
  const lip = ribbon(TRAIL_CURVE, 0.060, 0.0032,
    new THREE.MeshStandardMaterial({color:PAL.trailLip, roughness:1, transparent:true,
      opacity:.5, envMapIntensity:.2}), 110, 1);
  root.add(lip);
  // stones pressed into the path
  const M = new Merger(), R = rng(31);
  for (let i=0;i<(LITE?24:54);i++){
    const u = R(), p = TRAIL_CURVE.getPointAt(u), t = TRAIL_CURVE.getTangentAt(u);
    let nx = -t.z, nz = t.x; const l = Math.hypot(nx,nz)||1; nx/=l; nz/=l;
    const s = (R()-0.5)*0.05;
    const x = p.x + nx*s, z = p.z + nz*s, r = 0.0035 + R()*0.004;
    M.add(new THREE.DodecahedronGeometry(r, 0), TRS(x, H(x,z)+r*0.3, z, R()*3, R()*3, 0, 1, 0.6, 1),
          R() > .5 ? "#A89374" : "#8E7351");
  }
  const st = new THREE.Mesh(M.build(), new THREE.MeshStandardMaterial({
    vertexColors:true, flatShading:true, roughness:1}));
  st.receiveShadow = true; root.add(st);
  return TRAIL_CURVE;
}

function buildRiver(root){
  const pts = [];
  for (let i=0;i<=8;i++){
    const x = lerp(-0.485, 0.485, i/8);
    pts.push(new THREE.Vector3(x, 0, riverZ(x)));
  }
  const curve = new THREE.CatmullRomCurve3(pts);

  // the water: the 2D build's riverGrad — gold at the near edge, dusk-purple at the far
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0,0,0,64);
  g.addColorStop(0, PAL.riverHi); g.addColorStop(.42, PAL.riverMid); g.addColorStop(1, PAL.riverLo);
  x.fillStyle = g; x.fillRect(0,0,256,64);
  const R = rng(5);
  x.strokeStyle = 'rgba(255,245,215,.55)'; x.lineWidth = 2.2; x.lineCap = 'round';
  for (let i=0;i<44;i++){
    const px = R()*256, py = R()*64;
    x.beginPath(); x.moveTo(px,py); x.quadraticCurveTo(px+10, py-4, px+24, py); x.stroke();
  }
  const tex = srgb(new THREE.CanvasTexture(c));
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.anisotropy = MAXANISO;
  const water = ribbon(curve, 0.085, 0.016, new THREE.MeshStandardMaterial({
    map:tex, emissive:"#8E5A3C", emissiveIntensity:.35, roughness:.16, metalness:.3,
    transparent:true, opacity:.93, envMapIntensity:1.3}), 90, 7);
  root.add(water);

  // wet stones along both banks
  const M = new Merger(), S = rng(19);
  for (let i=0;i<(LITE?16:34);i++){
    const px = -0.465 + S()*0.93;
    const side = S() > .5 ? 1 : -1;
    const pz = riverZ(px) + side*(0.052 + S()*0.03);
    const r = 0.004 + S()*0.006;
    M.add(new THREE.DodecahedronGeometry(r, 0),
          TRS(px, H(px,pz) + r*0.3, pz, S()*3, S()*3, 0, 1, .7, 1), S() > .5 ? "#8E8A84" : "#6E6A66");
  }
  const bank = new THREE.Mesh(M.build(), new THREE.MeshStandardMaterial({
    vertexColors:true, flatShading:true, roughness:.6, envMapIntensity:.6}));
  bank.receiveShadow = true; root.add(bank);
  return {curve, tex};
}

// the deck's height over the ground beneath it, by distance from its middle: level with the
// trail at each end, arching well clear of the water (which floats 0.016 over its bed) between.
// The ground rises toward both banks, so this has to be measured plank by plank — one level
// taken at the middle left the uphill end of the deck under water.
const BRIDGE_HALF = 0.075;
const deckOff = s => 0.0045 + 0.026*Math.sqrt(Math.max(0, 1 - Math.pow(s/BRIDGE_HALF, 2)));
// how high the walker rides over the bridge
function bridgeLift(s){
  return Math.abs(s) < BRIDGE_HALF ? deckOff(s) - 0.0045 : 0;
}

function buildBridge(root, trail, river){
  // where the trail crosses the water
  let uB = 0.2, best = 9;
  for (let u=0; u<=0.6; u+=0.004){
    const p = trail.getPointAt(u);
    const d = Math.abs(p.z - riverZ(p.x));
    if (d < best){ best = d; uB = u; }
  }
  const bp = trail.getPointAt(uB), bt = trail.getTangentAt(uB);
  const yaw = Math.atan2(-bt.z, bt.x);
  const g = new THREE.Group();
  g.position.set(bp.x, 0, bp.z); g.rotation.y = yaw;

  // the top of the deck at s along the bridge (local +x runs along the trail)
  const tl = Math.hypot(bt.x, bt.z) || 1;
  const top = s => H(bp.x + s*bt.x/tl, bp.z + s*bt.z/tl) + deckOff(s);
  const pitch = s => Math.atan2(top(s + 0.002) - top(s - 0.002), 0.004);
  const M = new Merger();
  const N = Math.round(BRIDGE_HALF*2/0.0112);
  for (let i=0;i<=N;i++){
    const s = -BRIDGE_HALF + i*BRIDGE_HALF*2/N;
    M.add(new THREE.BoxGeometry(0.0104, 0.005, 0.058),
          TRS(s, top(s) - 0.0025, 0, 0, 0, pitch(s)),
          i % 2 ? "#9A6B45" : "#B07D52");
  }
  // posts, and a handrail that follows the arch from post to post
  const posts = [-0.068, -0.023, 0.023, 0.068];
  [-1,1].forEach(side => {
    posts.forEach(s => M.add(new THREE.CylinderGeometry(0.0026, 0.0026, 0.026, 6),
          TRS(s, top(s) + 0.013, side*0.031), PAL.woodDark));
    for (let k=0;k<posts.length-1;k++){
      const a = posts[k], b = posts[k+1];
      const ya = top(a) + 0.025, yb = top(b) + 0.025;
      M.add(new THREE.BoxGeometry(Math.hypot(b-a, yb-ya), 0.0025, 0.0035),
            TRS((a+b)/2, (ya+yb)/2, side*0.031, 0, 0, Math.atan2(yb-ya, b-a)), "#7A5540");
    }
  });
  const m = new THREE.Mesh(M.build(), new THREE.MeshStandardMaterial({
    vertexColors:true, flatShading:true, roughness:.85}));
  m.castShadow = !LITE; m.receiveShadow = true;
  g.add(m); root.add(g);
  return uB;
}

/* ============================================================
   prayer flags — blue, white, red, green, yellow, left to right, always
   ============================================================ */
let FLAG_TEX = null;
function prayerFlags(root, ax, az, bx, bz, height, n, out){
  if (!FLAG_TEX) FLAG_TEX = flagTex();
  const topA = H(ax,az) + height, topB = H(bx,bz) + height*0.84;
  const M = new Merger();
  [[ax,az,topA],[bx,bz,topB]].forEach(p => {
    M.add(new THREE.CylinderGeometry(0.0028, 0.0042, p[2]-H(p[0],p[1]), 7),
          TRS(p[0], (p[2]+H(p[0],p[1]))/2, p[1]), PAL.woodDark);
  });
  const pole = new THREE.Mesh(M.build(), new THREE.MeshStandardMaterial({
    vertexColors:true, flatShading:true, roughness:.9}));
  pole.castShadow = !LITE; root.add(pole);

  const sag = 0.032;
  const at = u => new THREE.Vector3(
    lerp(ax,bx,u),
    lerp(topA,topB,u) - sag*Math.sin(Math.PI*u),
    lerp(az,bz,u));
  const line = [];
  for (let i=0;i<=20;i++) line.push(at(i/20));
  root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(line),
    new THREE.LineBasicMaterial({color:"#4A3B2E"})));

  const baseRot = Math.atan2(-(bz-az), bx-ax);
  for (let i=0;i<n;i++){
    const u = (i+0.6)/(n+0.2);
    const pivot = new THREE.Group();
    pivot.position.copy(at(u));
    const geo = new THREE.PlaneGeometry(0.030, 0.024, 7, 5);
    geo.translate(0.015, 0, 0);          // the attached edge sits on the pivot
    const fl = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      map:FLAG_TEX, color:FLAG_COLS[i%5], side:THREE.DoubleSide, roughness:1,
      emissive:FLAG_COLS[i%5], emissiveIntensity:.07}));
    fl.position.set(0, -0.013, 0);
    pivot.add(fl); root.add(pivot);
    out.push({pivot, geo, base:geo.attributes.position.array.slice(), i, baseRot});
  }
}

/* ============================================================
   grass, gurans bushes, rocks — the small stuff that makes it a place
   ============================================================ */
function buildScatter(root){
  const M = new Merger(), R = rng(101);
  // grass blades: one merged mesh instead of two hundred and sixty little ones
  const tufts = LITE ? 70 : 150;
  for (let i=0;i<tufts;i++){
    const x = -0.47 + R()*0.94, z = -0.44 + R()*0.95;
    if (Math.abs(z - riverZ(x)) < 0.05) continue;
    if (nearTrail(x, z) < 0.030) continue;
    const y = H(x,z), front = z > 0.30;
    const col = front ? "#2A3C26" : (R() > .5 ? PAL.grassLit : "#5E7A34");
    const hh = front ? 0.020 + R()*0.016 : 0.009 + R()*0.011;
    for (let k=0;k<3;k++){
      const a = R()*6.283, w = hh*0.11, bend = (R()-0.5)*hh*0.7;
      const bx = x + Math.cos(a)*hh*0.14, bz = z + Math.sin(a)*hh*0.14;
      M.quad([bx-w, y, bz], [bx+w, y, bz],
             [bx+w*0.3 + bend, y+hh, bz + bend*0.6],
             [bx-w*0.3 + bend, y+hh, bz + bend*0.6], col);
    }
  }
  const grass = new THREE.Mesh(M.build(), new THREE.MeshStandardMaterial({
    vertexColors:true, flatShading:true, side:THREE.DoubleSide, roughness:1, envMapIntensity:.2}));
  root.add(grass);

  // lali gurans — the national flower — dotted along the climb
  const B = new Merger(), S = rng(53);
  for (let i=0, n=0; i<120 && n<(LITE?7:14); i++){
    const x = -0.46 + S()*0.92, z = -0.40 + S()*0.88;
    if (nearTrail(x, z) < 0.042 || nearTrail(x, z) > 0.17) continue;
    if (Math.abs(z - riverZ(x)) < 0.06) continue;
    n++;
    const y = H(x,z), r = 0.016 + S()*0.010;
    B.add(new THREE.IcosahedronGeometry(r, 0), TRS(x, y + r*0.42, z, 0, S()*3, 0, 1, 0.56, 1), "#2B4026");
    for (let k=0;k<5;k++){
      const a = k/5*6.283 + S();
      B.add(new THREE.IcosahedronGeometry(r*0.21, 0),
            TRS(x + Math.cos(a)*r*0.64, y + r*0.62 + S()*r*0.2, z + Math.sin(a)*r*0.64), PAL.guras);
    }
  }
  // boulders
  for (let i=0, n=0; i<160 && n<(LITE?5:10); i++){
    const x = -0.46 + S()*0.92, z = -0.44 + S()*0.9;
    if (nearTrail(x, z) < 0.05) continue;
    if (Math.abs(z - riverZ(x)) < 0.07) continue;
    if (Math.hypot(x-HOUSE_P.x, z-HOUSE_P.z) < 0.15) continue;
    if (Math.hypot(x-TEMPLE_P.x, z-TEMPLE_P.z) < 0.15) continue;
    n++;
    const r = 0.010 + S()*0.012;
    B.add(new THREE.DodecahedronGeometry(r, 0),
          TRS(x, H(x,z) + r*0.45, z, S()*3, S()*3, 0), S() > .5 ? "#A39B9B" : "#8E8690");
  }
  const bits = new THREE.Mesh(B.build(), new THREE.MeshStandardMaterial({
    vertexColors:true, flatShading:true, roughness:.88, envMapIntensity:.35}));
  bits.castShadow = !LITE; bits.receiveShadow = true; root.add(bits);
}

/* ============================================================

   and a lali gurans he has been carrying since the bottom of the hill.

// the dhaka weave: small diamonds in navy, red and blue on an off-white ground
function topiTex(){
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = '#EEE8DE'; x.fillRect(0,0,256,64);
  const cols = ['#24346A', '#B2333E', '#3E6FB4', '#24346A'];
  for (let r=0;r<4;r++) for (let k=0;k<16;k++){
    const cx = k*16 + (r%2)*8 + 4, cy = r*16 + 8;
    x.fillStyle = cols[(k + r) % cols.length];
    x.beginPath(); x.moveTo(cx, cy-6); x.lineTo(cx+5, cy); x.lineTo(cx, cy+6); x.lineTo(cx-5, cy);
    x.closePath(); x.fill();
    x.fillStyle = '#EEE8DE'; x.fillRect(cx-1.5, cy-1.5, 3, 3);
  }
  const t = srgb(new THREE.CanvasTexture(c));
  t.wrapS = THREE.RepeatWrapping; t.anisotropy = MAXANISO;
  return t;
}

// His proportions, in his own units (the root is scaled by S onto the card). A stylised
// figure about 5.5 heads tall, but with the proportions figure drawing is built on: the hip
// joint at half his height, the knee halfway down the leg, fingertips reaching mid-thigh.
// G is where his soles meet the ground; everything else is measured up from it.
// S alone sets how tall he stands on the card — change it and every proportion comes along.
const BOY = {S:0.44, G:-0.011, LT:0.064, LS:0.062, FOOT:0.007,
             TH:0.078, UA:0.050, FA:0.044, HEAD:0.64};
BOY.HIP = BOY.G + BOY.LT + BOY.LS + BOY.FOOT;
BOY.LEG = (BOY.LT + BOY.LS + BOY.FOOT) * BOY.S;     // leg length on the card
BOY.LIFT = 0.0045 - BOY.G * BOY.S;                  // root height that puts his soles on the trail
BOY.K = BOY.S / 0.58;                               // his size against the build the gait was tuned on

function buildBoy(){
  const {LT, LS, TH, UA, FA} = BOY;
  const root = new THREE.Group();
  const body = new THREE.Group(); root.add(body);
  const skin  = smat(PAL.skin,  {roughness:.72});
  const cloth = smat(PAL.cloth, {roughness:.8});
  const pant  = smat(PAL.pant,  {roughness:.84});
  const coat  = smat(PAL.coat,  {roughness:.78});
  const hair  = smat(PAL.hair,  {roughness:.6});
  const hips = [], knees = [], shoulders = [], elbows = [], eyes = [];

  // two-segment legs
  [-1,1].forEach(s => {
    const hip = new THREE.Group(); hip.position.set(s*0.016, BOY.HIP, 0);
    const thigh = new THREE.Mesh(new THREE.CylinderGeometry(.0112,.0098,LT,9), pant);
    thigh.position.y = -LT/2; thigh.castShadow = !LITE; hip.add(thigh);
    const knee = new THREE.Group(); knee.position.y = -LT; hip.add(knee);
    const shin = new THREE.Mesh(new THREE.CylinderGeometry(.0098,.0084,LS,9), pant);

/* --------- the poses, in the order he moves through them --------- */
// y: how far the hips drop · lean: how far he folds forward
// hip/knee: [kneeling-side, other] · sh: [[x,z],[x,z]] · el: [left,right]
// Joint signs: +hip swings the leg back, +knee folds the shin back (the only way a knee bends).
// Kneeling is not taste, it falls out of the leg lengths: the back knee on the ground puts
// the hips one thigh-length up, which fixes y; the front shin stands upright from the ground,
// which fixes how far the front thigh reaches forward.
const KNEEL = (()=>{
  const {LT, LS, FOOT} = BOY, back = .10;
  const y = LT*Math.cos(back) - LT - LS - FOOT;
  const th = Math.acos(clamp((LT*Math.cos(back) - LS - FOOT) / LT, -1, 1));
  return {y, hip:[back, -th], knee:[1.75, th]};
})();
const POSE = {
  stand: {y:0, lean:.05, hip:[.02,-.02], knee:[.04,.05],
          sh:[[-.05,-.08],[.05,.08]], el:[-.14,-.14], head:.02},
  // kneeling at the shrine: one knee down, palms joined, head bowed
  pray:  {y:KNEEL.y, lean:.30, hip:KNEEL.hip, knee:KNEEL.knee,
          sh:[[-.52,.70],[-.52,-.70]], el:[-1.85,-1.85], head:.34},
  // standing bow, palms together
  namaste:{y:0, lean:.26, hip:[.02,-.02], knee:[.04,.05],
          sh:[[-.50,.70],[-.50,-.70]], el:[-1.85,-1.85], head:.26},
  // one knee, turned to her, the gurans held out
  offer: {y:KNEEL.y, lean:-.04, hip:KNEEL.hip, knee:KNEEL.knee,
          sh:[[-.28,.22],[-1.20,-.10]], el:[-.62,-.22], head:-.14}
};
function blendPose(a, b, t){
  if (t <= 0) return a;
  if (t >= 1) return b;
  return {
    y:lerp(a.y,b.y,t), lean:lerp(a.lean,b.lean,t), head:lerp(a.head,b.head,t),
    hip:[lerp(a.hip[0],b.hip[0],t), lerp(a.hip[1],b.hip[1],t)],
    knee:[lerp(a.knee[0],b.knee[0],t), lerp(a.knee[1],b.knee[1],t)],
    sh:[[lerp(a.sh[0][0],b.sh[0][0],t), lerp(a.sh[0][1],b.sh[0][1],t)],
        [lerp(a.sh[1][0],b.sh[1][0],t), lerp(a.sh[1][1],b.sh[1][1],t)]],
    el:[lerp(a.el[0],b.el[0],t), lerp(a.el[1],b.el[1],t)]
  };
}
// the walk, written as a pose so it blends with everything else.
// swing: how far each thigh swings either side of vertical, set from the stride length so the
// planted foot travels exactly as fast as the ground goes by.
// Over one cycle a leg's hip angle runs legA*sin(phase): rising while that foot is planted and
// pushing back, falling while it swings through. The knee folds only during the swing, most
// just after toe-off, and is straight again at heel strike.
function walkPose(phase, amp, swing){
  const s = Math.sin(phase), s2 = Math.sin(phase + Math.PI);
  const legA = swing*amp, armA = swing*1.1*amp;
  const bend = p => .04 + Math.max(0, Math.sin(p - Math.PI*.35))*.9*amp;
  // the hips ride highest with one leg upright, lowest with both feet down
  const drop = BOY.LEG/BOY.S*(1 - Math.cos(legA));
  return {
    y: -drop*(0.5 - 0.5*Math.cos(2*phase)),
    lean: .05 + .06*amp,
    head: .02 - .03*Math.sin(2*phase)*amp,
    hip:[legA*s, legA*s2],
    knee:[bend(phase), bend(phase + Math.PI)],
    // each arm swings with the opposite leg, the elbow folding a little more going forward
    sh:[[-armA*s, -.08], [-armA*s2, .08]],
    el:[-.14 - .35*Math.max(0,s)*amp, -.14 - .35*Math.max(0,s2)*amp]
  };
}

/* ============================================================
   the garland and her name
   ============================================================ */
function buildFinale(name){
  const fin = new THREE.Group();
  const flowers = [], leaves = [];
  const R = rng(23);
  const W = 0.26, LIFT = 0.055;

  const back = halo(PAL.marigold, 0.34);
  back.position.set(0, 0.012, -0.02); back.renderOrder = 2; fin.add(back);

  // a sayapatri garland, strung the way they're hung over a doorway
  for (let i=0;i<26;i++){
    const u2 = i/25;
    const px = lerp(-W, W, u2);
    const py = LIFT + Math.sin(Math.PI*u2)*0.030 - Math.pow(Math.abs(u2-0.5)*2, 2.4)*0.030;
    const f = marigold(0.0105 + R()*0.0035, i%4 === 3 ? "#F6C23A" : PAL.marigold);
    f.userData.home = new THREE.Vector3(px, py, 0);
    f.userData.u = u2;
    f.position.copy(f.userData.home);
    f.scale.setScalar(0.0001);
    fin.add(f); flowers.push(f);
  }
  // a few green leaves tucked into the string
  for (let i=0;i<8;i++){
    const u2 = (i+0.5)/8;
    const px = lerp(-W*0.94, W*0.94, u2);
    const py = LIFT + Math.sin(Math.PI*u2)*0.030 - Math.pow(Math.abs(u2-0.5)*2, 2.4)*0.030 - 0.010;
    const lf = new THREE.Mesh(new THREE.IcosahedronGeometry(0.009, 0), smat("#3E6B35"));
    lf.scale.set(1.5,.3,.9); lf.rotation.z = (R()-0.5)*1.2;
    lf.position.set(px, py, -0.002);
    lf.userData.u = u2;
    lf.scale.multiplyScalar(0.0001);
    lf.userData.base = new THREE.Vector3(1.5,.3,.9);
    fin.add(lf); leaves.push(lf);
  }

  const nameHalo = halo("#FFBF7A", 0.16);
  nameHalo.position.set(0, -0.012, -0.004); nameHalo.renderOrder = 3; fin.add(nameHalo);

  const nm = new THREE.Mesh(new THREE.PlaneGeometry(0.30, 0.30*512/1536),
    new THREE.MeshBasicMaterial({map:makeNameTex(name), transparent:true, opacity:0,
      depthWrite:false, depthTest:false, toneMapped:false}));
  nm.position.set(0, -0.012, 0.006); nm.renderOrder = 12; fin.add(nm);

  const rule = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.22*64/512),
    new THREE.MeshBasicMaterial({map:makeRuleTex(), transparent:true, opacity:0,
      depthWrite:false, depthTest:false, toneMapped:false}));
  rule.position.set(0, -0.046, 0.006); rule.renderOrder = 12; fin.add(rule);

  fin.visible = false;
  return {fin, flowers, leaves, nameMesh:nm, nameHalo, back, rule};
}

/* ============================================================
   particles — fireflies out of the grass, stars, petals on the wind
   ============================================================ */
function makePoints(n, color, size, box, tex, flicker){
  const base = new Float32Array(n*3), seeds = new Float32Array(n);
  const R = rng(n*13 + (size*1000|0));
  for (let i=0;i<n;i++){
    base[i*3]   = box.x[0] + R()*(box.x[1]-box.x[0]);
    base[i*3+1] = box.y[0] + R()*(box.y[1]-box.y[0]);
    base[i*3+2] = box.z[0] + R()*(box.z[1]-box.z[0]);
    seeds[i] = R()*100;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(base.slice(), 3));
  if (flicker){
    const col = new Float32Array(n*3); col.fill(1);
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  }
  const m = new THREE.PointsMaterial({color, size, map:tex, transparent:true, opacity:0,
    depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true,
    vertexColors:!!flicker, toneMapped:false});
  const pts = new THREE.Points(g, m); pts.frustumCulled = false;
  return {pts, base, seeds, n, box, flicker};
}

// the petals that come off the garland: real little quads, so they tumble
function buildPetals(n){
  const tex = petalTex();
  const items = [], R = rng(91);
  const cols = [PAL.marigold, PAL.marigoldPale, PAL.guras, "#FFE1A8", PAL.gurasHi];
  const geo = new THREE.PlaneGeometry(0.016, 0.011);
  const group = new THREE.Group(); group.visible = false;
  for (let i=0;i<n;i++){
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      map:tex, color:cols[i%cols.length], transparent:true, opacity:0,
      side:THREE.DoubleSide, depthWrite:false, toneMapped:false}));
    group.add(m);
    items.push({m, born:-99, x:0, y:0, z:0, vx:0, vy:0, vz:0,
                rot:R()*6.283, vr:(R()-0.5)*5, ph:R()*6.283, sc:0.6 + R()*0.9});
  }
  return {group, items};
}

/* ============================================================
   clouds and the sun that sets behind the range
   ============================================================ */
function buildClouds(root){
  const clouds = [], R = rng(13);
  for (let i=0;i<4;i++){
    const g = new THREE.Group();
    [[0,0,0,.048],[.048,-.008,.010,.038],[-.048,-.010,-.006,.036],[.016,.010,-.012,.030]]
      .forEach(c => {
        const m = new THREE.Mesh(new THREE.IcosahedronGeometry(c[3], 1),
          smat("#FFD3A4", {emissive:"#FFD3A4", emissiveIntensity:.35, roughness:1, flatShading:true}));
        m.position.set(c[0], c[1], c[2]); m.scale.y = .62; g.add(m);
      });
    g.position.set(0, 0.650 + i*0.028, -0.30 - i*0.07);
    g.userData.off = i/4 + R()*0.1;
    g.userData.y = g.position.y;
    g.userData.scale = 0.64 + R()*0.45;
    g.scale.setScalar(g.userData.scale);
    root.add(g); clouds.push(g);
  }
  return clouds;
}

function buildSun(root){
  const g = new THREE.Group();
  const halo1 = halo("#FFD089", 0.62); halo1.material.opacity = .5; g.add(halo1);
  const disc  = halo("#FFFCEE", 0.14); disc.material.opacity = .95; g.add(disc);
  // It sits well behind the range, so it has to start high enough to actually clear the
  // skyline — otherwise golden hour happens with the sun already hidden.
  g.position.set(0.40, 0.64, -0.86);
  root.add(g);
  return {g, halo:halo1, disc, y0:0.64};
}
